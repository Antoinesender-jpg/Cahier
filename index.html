<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cahier">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Cahier de bord</title>
<style>
/* ==========================================================================
   STYLES V3 : sobre, police système (San Francisco sur iPhone/iPad)
   ========================================================================== */
:root{
  --bg:#F4F4F1; --surface:#FFFFFF; --surface2:#F0EFEC; --ink:#18181A; --muted:#6C6C70; --faint:#A1A1A6; --line:#E4E3DF;
  --accent:#2D55C8; --accent-ink:#FFFFFF; --accent-soft:#E8EDFA; --danger:#C2402F; --ok:#1E8A55; --warn:#A86A0B;
  --shadow:0 1px 2px rgba(20,20,30,.04),0 4px 14px rgba(20,20,30,.05);
  --flip-bg:#232326; --flip-ink:#F5F5F7; --flip-cut:#101012;
  --c-maths:#C8524A; --c-physique:#6E7C8E; --c-chimie:#8F5BA6; --c-sii:#C98F2A; --c-francais:#4F78D0;
  --c-anglais:#3489BF; --c-espagnol:#A8902A; --c-info:#6670B8; --c-eps:#46936E; --c-lv:#3489BF; --c-cb:#6E6E73; --c-autre:#8E8E93;
  --r:14px; --top:56px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E10; --surface:#18181B; --surface2:#222226; --ink:#EDEDEF; --muted:#9C9CA3; --faint:#5F5F66; --line:#2A2A2F;
    --accent:#7B9BFF; --accent-ink:#0E0E10; --accent-soft:#1D2540; --danger:#F07C6C; --ok:#4CC38A; --warn:#E0A84A;
    --shadow:none; --flip-bg:#2A2A2E; --flip-cut:#0E0E10;
    --c-maths:#E2736B; --c-physique:#97A3B3; --c-chimie:#B585CA; --c-sii:#E2AE4E; --c-francais:#7D9DF0;
    --c-anglais:#5FAEE0; --c-espagnol:#CDB650; --c-info:#959DE0; --c-eps:#6CC39A; --c-lv:#5FAEE0;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E10; --surface:#18181B; --surface2:#222226; --ink:#EDEDEF; --muted:#9C9CA3; --faint:#5F5F66; --line:#2A2A2F;
  --accent:#7B9BFF; --accent-ink:#0E0E10; --accent-soft:#1D2540; --danger:#F07C6C; --ok:#4CC38A; --warn:#E0A84A; --shadow:none;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font);-webkit-tap-highlight-color:transparent;min-height:100vh;
  padding-top:env(safe-area-inset-top,0px)}
body.noscroll{overflow:hidden}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.1;letter-spacing:-.02em}
h2{font-size:19px} h3{font-size:16px}
b{font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ic.fill{fill:currentColor;stroke:none}
.sub{color:var(--muted);font-size:14px}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px} .row.wrap{flex-wrap:wrap}
.center{text-align:center;justify-content:center}
.pad{padding:12px 0}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c,var(--c-autre))}

/* ---------- Charpente : barre latérale (iPad paysage, ordinateur), en-tête, onglets ---------- */
.shell{display:block}
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:var(--top);gap:12px}
.top h1{font-size:19px;letter-spacing:-.01em}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
body[data-tab="plan"] .wrap,body[data-tab="home"] .wrap{max-width:1240px}
main{padding:8px 0 calc(100px + env(safe-area-inset-bottom,0px))}
.iconbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--muted);position:relative;flex:none}
.iconbtn:active{background:var(--surface2)}
.syncdot{position:absolute;right:7px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--faint);border:2px solid var(--bg)}
.syncdot[data-m="ok"]{background:var(--ok)} .syncdot[data-m="busy"]{background:var(--accent)} .syncdot[data-m="warn"]{background:var(--warn)} .syncdot[data-m="err"]{background:var(--danger)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--faint);font-size:11px;font-weight:600;position:relative;text-align:center}
.tab[aria-current="page"]{color:var(--accent)}
.tab .live{position:absolute;top:8px;left:calc(50% + 7px);width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--surface)}
@media (min-width:1100px){
  .shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
  .side{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;padding:20px 12px;border-right:1px solid var(--line);background:var(--surface)}
  .side .brand{font-weight:700;font-size:17px;padding:4px 12px 18px}
  .side .tab{flex-direction:row;justify-content:flex-start;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;font-size:15px;color:var(--muted)}
  .side .tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .side .tab .live{position:static;margin-left:auto}
  .side-foot{margin-top:auto}
  .tabs{display:none}
  main{padding-bottom:40px}
  .fab{bottom:28px!important}
}

/* ---------- Éléments de base ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.card.list{padding:2px 16px}
section{margin-top:24px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 10px}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.link{color:var(--accent);font-weight:600;font-size:14px;min-height:32px}
.btn{min-height:46px;padding:0 18px;border-radius:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--surface);border:1px solid var(--line);color:var(--ink);white-space:nowrap;transition:transform .08s}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 13px;font-size:14px;border-radius:10px}
.btn.big{min-width:150px;min-height:54px;font-size:17px}
.btn:active{transform:scale(.98)}
.mini{min-height:34px;padding:0 12px;border-radius:9px;font-weight:600;font-size:13px;background:var(--surface2);flex:none}
.mini.ok{background:var(--ok);color:#fff}
.icon-sm{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-sm svg{width:15px;height:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.center{flex-wrap:wrap;justify-content:center}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sm{min-height:32px;font-size:13px;padding:0 11px}
.chip:disabled{opacity:.55}
.seg{display:flex;gap:2px;background:var(--surface2);padding:3px;border-radius:11px;margin:4px 0 14px}
.seg button{flex:1;min-height:36px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);text-align:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button:disabled{opacity:.5}
.seg-sm button{min-height:32px;font-size:13px}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:11px 14px;font-size:14px;margin:0 0 12px}
.pill{display:inline-block;margin-top:10px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px;padding:6px 12px;border-radius:999px}
.empty{text-align:center;padding:36px 18px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.empty svg{width:40px;height:40px;color:var(--faint);margin-bottom:6px}
.empty b{color:var(--ink);font-size:16px}
.empty span{max-width:420px;font-size:14px}
.note{margin:14px 4px 0;font-size:13px}
.streak{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--warn);font-size:13px}
.streak svg{width:16px;height:16px}
.check{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;background:var(--surface)}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.check svg{width:16px;height:16px;stroke-width:2.6}

/* Lignes de liste */
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.li:first-child{border-top:0}
.li b{display:block;font-weight:600;overflow-wrap:anywhere}
.li .when{flex:none;width:86px;font-size:13px;font-weight:600;color:var(--muted)}
.li .when.late{color:var(--danger)} .li .when.soon{color:var(--warn)}
.li.total{justify-content:space-between}
.li .dur{font-variant-numeric:tabular-nums;font-weight:600}
button.li .sub{display:block}

/* ---------- Accueil ---------- */
.hello{padding:18px 2px 4px}
.hello .date{color:var(--muted);font-size:14px;font-weight:600;margin-bottom:4px}
.cols2{display:grid;gap:0 20px}
@media (min-width:900px){.cols2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
.cta{display:flex;gap:14px;align-items:center;margin-top:16px;border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.ag{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.ag:first-child{border-top:0}
.ag-t{width:48px;flex:none;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ag.fixed b{font-weight:500;color:var(--muted)}
.ag.done b{text-decoration:line-through;color:var(--muted)}
.ag b{display:block}
.gauge{position:relative;display:grid;justify-items:center;margin:4px 0 8px}
.gauge svg{width:100%;max-width:260px}
.gauge .read{position:absolute;bottom:0;text-align:center}
.gauge .read b{display:block;font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gauge .read span{font-size:12.5px;color:var(--muted)}
.srows{margin:10px 0 8px}
.srow{display:grid;grid-template-columns:9px 76px 1fr 92px;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.srow .sv{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.srow .sv small{font-weight:400;color:var(--muted)}

/* ---------- Planning ---------- */
.ptop{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 12px}
.pnav{display:flex;align-items:center;gap:4px}
.plabel{min-width:0;text-align:center;padding:0 4px}
.plabel b{display:block;font-size:17px}
.pact{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:699px){.ptop{flex-direction:column;align-items:stretch}.pnav{justify-content:space-between}.pact .btn span{display:none}.pact{justify-content:center}.pact .btn{flex:1}}
.psum{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:0 0 12px}
.ptot{font-size:14px}.ptot b{font-size:16px}
.mchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.mchips::-webkit-scrollbar{display:none}
.mchip{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.mchip small{color:var(--muted)}
.mchip.met{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.armbar{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;margin:0 0 12px;font-size:14px}
.armbar .link{color:var(--bg);text-decoration:underline}
.pempty{font-size:14px;color:var(--muted);margin:0 2px 12px}
.pempty b{color:var(--ink)}
.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:0 0 12px}
.dchip{min-height:60px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;color:var(--muted);font-weight:600;text-align:center}
.dchip b{font-size:18px;color:var(--ink);font-weight:650}
.dchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dchip[aria-pressed="true"] b{color:var(--bg)}
.dchip.today:not([aria-pressed="true"]) b{color:var(--accent)}
.dchip .marks{display:flex;gap:3px;height:5px}
.dchip .marks i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.dchip .marks i.n{background:var(--faint)}
.pwrap{display:grid;gap:14px}
.pside{display:grid;gap:14px}
@media (min-width:700px) and (max-width:1099px){.pside{grid-template-columns:1fr 1fr}}
@media (min-width:1100px){.pwrap.wide{grid-template-columns:minmax(0,1fr) 270px;align-items:start}.pside{position:sticky;top:calc(var(--top) + 12px)}}
.pbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 6px}
.pbox h3{margin-bottom:4px}
.pbox .li{padding:10px 0}
.pbox .li.armed{background:var(--accent-soft);margin:0 -16px;padding:10px 16px;width:calc(100% + 32px)}
.pgrid{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:clip;user-select:none;-webkit-user-select:none}
.phead{display:grid;grid-template-columns:46px repeat(7,minmax(0,1fr));position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top));z-index:6;
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.ph{display:flex;flex-direction:column;align-items:center;padding:8px 0 7px;font-size:11px;font-weight:600;color:var(--muted);text-align:center}
.ph b{font-size:17px;color:var(--ink);font-weight:650;line-height:1.15}
.ph.today b{color:var(--accent)}
.ph i{font-style:normal;font-size:10px;color:var(--accent)}
.pbody{position:relative}
.hl{position:absolute;left:0;right:0;border-top:1px solid var(--line);height:0}
.hl span{position:absolute;left:0;width:42px;text-align:right;top:-8px;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;background:var(--surface);padding-right:4px}
.hl:first-child span{top:2px}
.pcols{position:absolute;left:46px;right:0;top:0;bottom:0}
.pcol{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.pcol.hol{background:repeating-linear-gradient(135deg,transparent 0 9px,color-mix(in srgb,var(--accent) 5%,transparent) 9px 10px)}
.pbg{position:absolute;inset:0;z-index:1;cursor:crosshair}
.fx{position:absolute;z-index:2;pointer-events:none;border-radius:8px;padding:4px 7px;font-size:11.5px;line-height:1.25;overflow:hidden;
  background:var(--surface2);color:var(--muted)}
.fx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-colle{background:color-mix(in srgb,var(--c) 12%,var(--surface));border:1.5px dashed var(--c);color:var(--ink);min-height:30px}
.fx-ds{background:var(--ink);color:var(--bg)}
.blk{position:absolute;z-index:3;border-radius:8px;padding:4px 8px 4px 9px;overflow:hidden;cursor:grab;touch-action:none;
  background:color-mix(in srgb,var(--c) 16%,var(--surface));border-left:3px solid var(--c);font-size:12.5px;line-height:1.25;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 22%,transparent) inset;transition:box-shadow .15s}
.blk .bt{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.blk .bt svg{width:12px;height:12px;stroke-width:3;vertical-align:-1px;margin-right:3px;color:var(--ok)}
.blk .bm{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.tiny{display:flex;gap:6px;align-items:center;padding-top:1px;padding-bottom:1px}
.blk.tiny .bt{-webkit-line-clamp:1}
.blk.done{opacity:.6}
.blk.dragging{z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.18),0 0 0 2px var(--c) inset;cursor:grabbing;transition:none}
.blk .grip{position:absolute;left:0;right:0;bottom:0;height:12px;cursor:ns-resize}
.blk .grip::after{content:"";position:absolute;left:50%;bottom:3px;width:20px;height:3px;margin-left:-10px;border-radius:2px;background:color-mix(in srgb,var(--c) 45%,transparent);opacity:0;transition:opacity .15s}
.blk:hover .grip::after,.blk.dragging .grip::after{opacity:1}
@media (hover:none){.blk .grip::after{opacity:.8}}
.now{position:absolute;z-index:4;height:2px;background:var(--danger);pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}

/* ---------- Feuille modale ---------- */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
.sheet-back{position:absolute;inset:0;background:rgba(10,10,14,.42)}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92vh;overflow:auto;background:var(--surface);
  border-radius:20px 20px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
.sheet-panel h2{margin:0 36px 16px 0;font-size:21px}
.sheet-x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.sheet-x svg{width:16px;height:16px}
@media (min-width:700px){
  .sheet-panel{top:50%;bottom:auto;transform:translateY(-50%);border-radius:18px;max-height:86vh;padding:24px;animation:fade .16s ease-out;width:calc(100% - 48px)}
  .sheet-panel.wide{max-width:760px}
}
@keyframes up{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-actions{display:flex;gap:10px;margin-top:8px}
.sheet-actions .btn{flex:1}
.sheet-actions .btn.danger:first-child:has(svg:only-child){flex:0 0 52px;padding:0}
.stack>*+*{margin-top:10px}
.fld{display:block;margin:0 0 14px}
.fld>span{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);font-size:16px;-webkit-appearance:none;appearance:none}
.fld select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.fld textarea{min-height:84px;resize:vertical}
.fld2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.toggle{display:flex;align-items:center;gap:10px;margin:0 0 16px;font-weight:600}
.toggle input{width:22px;height:22px;accent-color:var(--ok)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;
  font-weight:600;font-size:14px;z-index:60;max-width:min(92vw,520px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.18)}
@media (min-width:1100px){.toast{bottom:28px}}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:25;width:54px;height:54px;border-radius:17px;
  background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.fab[hidden]{display:none}
.fab svg{width:24px;height:24px}

/* ---------- Tâches, suivi, notes (repris de la V2, redessinés) ---------- */
.task{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;width:100%;text-align:left}
.task .tt{flex:1;min-width:0}
.task .t1{font-weight:600;overflow-wrap:anywhere}
.task .t2{font-size:13px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap;align-items:center;margin-top:3px}
.task.done .t1{text-decoration:line-through;color:var(--muted)}
.task .late{color:var(--danger);font-weight:600}
.gr{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;width:100%;text-align:left}
.gr .sc{font-size:21px;font-weight:700;min-width:62px;text-align:right;font-variant-numeric:tabular-nums}
.gr .sc small{font-size:12px;color:var(--muted);font-weight:500}
.stars{color:var(--warn);letter-spacing:1px;font-size:13px;flex:none}
.x{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);flex:none}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpis .card+.card{margin-top:0}
.kpi b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--font)}
.subj-row{display:grid;grid-template-columns:96px 1fr 72px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.subj-row .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- Chrono ---------- */
.timer{padding:18px 16px 22px}
.clock{display:flex;justify-content:center;align-items:center;gap:clamp(4px,1.4vw,10px);margin:22px 0 10px;--w:clamp(36px,10vw,66px);--h:calc(var(--w)*1.4);--rr:9px}
.clock .grp{display:flex;gap:4px}
.clock .colon{font:600 clamp(24px,7vw,44px)/1 var(--font);color:var(--faint);padding-bottom:4px}
.fd{position:relative;width:var(--w);height:var(--h);perspective:500px;color:var(--flip-ink)}
.fd>div{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--flip-bg);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fd .u,.fd .fu{top:0;border-radius:var(--rr) var(--rr) 0 0;transform-origin:bottom;border-bottom:1px solid var(--flip-cut)}
.fd .l,.fd .fl{bottom:0;border-radius:0 0 var(--rr) var(--rr);transform-origin:top}
.fd b{position:absolute;left:0;right:0;height:200%;display:flex;align-items:center;justify-content:center;font:600 calc(var(--w)*.95)/1 var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.fd .u b,.fd .fu b{top:0}
.fd .l b,.fd .fl b{bottom:0}
.fd .fu,.fd .fl{visibility:hidden}
.fd.go .fu{visibility:visible;animation:fu .25s ease-in forwards}
.fd.go .fl{visibility:visible;animation:fl .25s ease-out .25s both}
@keyframes fu{to{transform:rotateX(-90deg)}}
@keyframes fl{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
@media (prefers-reduced-motion:reduce){.fd.go .fu,.fd.go .fl{animation:none;visibility:hidden}.sheet-panel{animation:none}}
.phase{text-align:center;font-weight:600;min-height:22px;color:var(--muted)}
.ctrls{display:flex;gap:10px;justify-content:center;margin:14px 0 2px;flex-wrap:wrap}

/* ---------- Historique ---------- */
.hhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-bottom:12px}
.hhead .seg{margin:0;min-width:200px}
.hbars{display:flex;gap:4px;align-items:flex-end;height:140px;margin-top:12px}
.hcol{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.hcol .stk{width:100%;max-width:30px;display:flex;flex-direction:column-reverse;border-radius:5px;overflow:hidden;background:var(--surface2)}
.hcol .stk i{display:block}
.hcol span{height:14px}
.hcol.today{color:var(--accent);font-weight:700}
.hcol.fut .stk{opacity:.35}
.hbars.month{gap:2px}
.tblwrap{overflow-x:auto;margin:6px -4px 0}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{display:flex;align-items:center;gap:8px}
.tbl .tbar{width:28%;min-width:60px}
.sday{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:2px 14px;margin-bottom:10px}
.sdh{display:flex;justify-content:space-between;padding:10px 0 6px;font-size:14px;color:var(--muted)}
.sdh b{color:var(--ink)}
.sday .li{padding:10px 0}

#print{display:none}
@media print{

  body{background:#fff;padding:0}
  body>*:not(#print){display:none!important}
  #print{display:block}
  #print img{width:100%;height:auto}
}

/* ==========================================================================
   SECTION 3 : ÉTAT, STOCKAGE LOCAL, FUSION ENTRE APPAREILS

const INTERVALS = [1, 3, 7, 15, 30];
const STATUS = ['Cours vu', 'Cours appris', 'Exercices faits', 'Maîtrisé'];
const COLS = ['edt', 'tasks', 'grades', 'sessions', 'chapters', 'errors', 'blocks'];   // blocks = créneaux du planning (V3)

const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* stockage indisponible : on continue en mémoire */ } };

function loadJSON(k) { try { const r = lsGet(k); return r ? JSON.parse(r) : null; } catch (e) { return null; } }

function defaults() {
  return {
    v: SCHEMA,
    settings: {u: 0, name: 'Antoine', option: 'PC', colleSlot: 3, weekStart: 'sat', targets: clone(DEFAULT_TARGETS), coefs: {}, slots: clone(DEFAULT_SLOTS), holSlots: clone(DEFAULT_HOL_SLOTS)},
    edt: DEFAULT_EDT.map((b, i) => ({id: 'e' + i, u: 0, day: b[0], start: b[1], end: b[2], subject: b[3], label: b[4]})),
    tasks: [], grades: [], sessions: [], chapters: [], errors: [], blocks: [], slotDone: {}
  };
}
// Donne à l'état sa forme attendue, sans rien supprimer de ce qui existe
function normalize(s) {
  const d = defaults();

  const st = (s.settings && typeof s.settings === 'object') ? s.settings : {};
  m.settings = Object.assign({}, d.settings, st, {u: +st.u || 0});
  m.settings.targets = Object.assign({}, d.settings.targets, st.targets || {});
  m.settings.coefs = Object.assign({}, st.coefs || {});
  m.settings.slots = Array.isArray(st.slots) && st.slots.length === 7 ? st.slots : d.settings.slots;
  m.settings.holSlots = Array.isArray(st.holSlots) && st.holSlots.length === 7 ? st.holSlots : d.settings.holSlots;
  if (m.settings.weekStart !== 'mon') m.settings.weekStart = 'sat';
  COLS.forEach(k => { m[k] = Array.isArray(s[k]) ? s[k].filter(r => r && r.id).map(r => Object.assign({}, r, {u: +r.u || 0})) : d[k]; });

  const sd = (s.slotDone && typeof s.slotDone === 'object') ? s.slotDone : {};
  Object.keys(sd).forEach(k => { const v = sd[k]; m.slotDone[k] = (v && typeof v === 'object') ? {v: !!v.v, u: +v.u || 0} : {v: !!v, u: 0}; });

}
// Migration V1 -> V2 : horodatage des enregistrements, temps de travail converti en sessions
function migrate(core, time) {
  if (core && typeof core === 'object' && (core.v || 1) < 2) {
    const u = core.updatedAt || Date.now();
    core = Object.assign({}, core);
    core.settings = Object.assign({}, core.settings || {}, {u});
    ['edt', 'tasks', 'grades'].forEach(k => { if (Array.isArray(core[k])) core[k] = core[k].map(r => Object.assign({}, r, {u})); });
    const sd = {}; Object.keys(core.slotDone || {}).forEach(k => { sd[k] = {v: !!core.slotDone[k], u}; }); core.slotDone = sd;
    core.sessions = [];

    Object.keys(by).forEach(d => Object.keys(by[d] || {}).forEach(k => {
      const m = +by[d][k]; if (m > 0) core.sessions.push({id: `m-${d}-${k}`, u: (time && time.updatedAt) || u, date: d, subject: k, min: m});
    }));

}
function mergeRec(a, b) {
  const m = {};
  (a || []).forEach(r => { m[r.id] = r; });
  (b || []).forEach(r => { const o = m[r.id]; if (!o || (+r.u || 0) > (+o.u || 0)) m[r.id] = r; });
  return Object.values(m);
}
function prune(s) {

}

  COLS.forEach(k => { out[k] = mergeRec(a[k], b[k]); });
  out.slotDone = Object.assign({}, a.slotDone);
  Object.keys(b.slotDone).forEach(k => { if (!out.slotDone[k] || b.slotDone[k].u > out.slotDone[k].u) out.slotDone[k] = b.slotDone[k]; });

}
const tomb = (r, u) => { const t = {id: r.id, del: true, u}; ['gid', 'gu', 'su'].forEach(k => { if (r[k] != null) t[k] = r[k]; }); return t; };

// Chargement : V2 si présente, sinon migration d'une éventuelle V1 sur ce même site
let S = (() => {
  const v2 = loadJSON(LS_CORE); if (v2) return prune(normalize(v2));
  const v1 = loadJSON(LS_CORE_V1); return prune(migrate(v1, loadJSON(LS_TIME_V1)));

let TM = loadJSON(LS_TIMER);     // chrono en cours, propre à l'appareil
let REV = 0;                     // compteur de versions locales (sert aux caches)
let planCache = null, aggCache = null;
const saveCore = () => lsSet(LS_CORE, JSON.stringify(S));
const saveTimer = () => { if (TM) lsSet(LS_TIMER, JSON.stringify(TM)); else lsDel(LS_TIMER); };
saveCore();

const live = k => S[k].filter(r => !r.del);
const findRec = (k, id) => S[k].find(r => r.id === id && !r.del);
function commit(fn, opt) {
  fn(S); REV++; saveCore(); planCache = null; scheduleSync();
  if (!opt || !opt.silent) render();
}
const addRec = (k, rec) => commit(s => { s[k].push(Object.assign({id: uid()}, rec, {u: Date.now()})); });
const updRec = (k, id, patch) => commit(s => { const r = s[k].find(x => x.id === id); if (r) Object.assign(r, patch, {u: Date.now()}); });
const delRec = (k, id) => commit(s => { const i = s[k].findIndex(x => x.id === id); if (i >= 0) s[k][i] = tomb(s[k][i], Date.now()); });

/* ==========================================================================
   SECTION 4 : SYNCHRO (script Google Apps Script personnel)
   L'app envoie tout son état, le script fusionne avec la copie stockée sur ton
   Drive, synchronise la liste Google Tasks « Prépa » et renvoie l'état fusionné.
   ========================================================================== */
let CFG = loadJSON(LS_CFG);      // {url, key} : réglé une fois par appareil
const SY = {mode: CFG ? 'busy' : 'local', busy: false, again: false, timer: null, last: 0, err: '', tasks: null};
function setSync(m) { SY.mode = m; const b = $('#syncdot'); if (b) { b.dataset.m = m; b.title = syncText(); } }
function syncText() {
  if (!CFG) return 'Synchro non configurée : données sur cet appareil uniquement';
  if (SY.mode === 'busy') return 'Synchronisation…';
  if (SY.mode === 'err') return 'Échec de la synchro : ' + SY.err;
  const at = SY.last ? `Synchronisé à ${fmtT(new Date(SY.last).getHours() * 60 + new Date(SY.last).getMinutes())}` : 'Synchro prête';
  if (SY.mode === 'warn' && SY.old) return at + '. Ton script Google date de la V2 : mets-le à jour pour synchroniser le planning (voir LISEZMOI)';
  if (SY.mode === 'warn') return at + '. Google Tasks ne répond pas : ' + tasksErr(SY.tasks && SY.tasks.error);
  return at + (SY.tasks && SY.tasks.list ? `, Google Tasks lié (liste ${SY.tasks.list})` : '');
}
function tasksErr(e) {
  if (e === 'service_off') return 'ajoute le service Google Tasks API dans le script';
  return e || 'erreur inconnue';
}
function scheduleSync(delay) {
  if (!CFG) return;
  clearTimeout(SY.timer); SY.timer = setTimeout(syncNow, delay == null ? 2500 : delay);
}
async function syncNow() {
  if (!CFG || !CFG.url) { setSync('local'); return; }
  if (SY.busy) { SY.again = true; return; }
  if (navigator.onLine === false) { SY.err = 'hors ligne'; setSync('err'); return; }
  SY.busy = true; setSync('busy');
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 30000);
  try {
    // Corps en texte brut : pas de requête préalable CORS, c'est ce qu'accepte Apps Script
    const res = await fetch(CFG.url, {method: 'POST', body: JSON.stringify({key: CFG.key, v: SCHEMA, state: S}), signal: ctl.signal, redirect: 'follow'});
    let j; try { j = await res.json(); } catch (e) { throw new Error('réponse illisible : vérifie l\'adresse et l\'accès « Tout le monde »'); }
    if (!j.ok) throw new Error(j.error === 'bad_key' ? 'clé refusée' : j.error === 'busy' ? 'serveur occupé, nouvel essai bientôt' : String(j.error));
    const before = JSON.stringify(S), merged = merge(S, j.state);
    SY.last = Date.now(); SY.tasks = j.tasks || null; SY.err = ''; SY.old = !(+j.version >= 3);
    if (JSON.stringify(merged) !== before) replaceState(merged);
    setSync(SY.old || (j.tasks && j.tasks.error) ? 'warn' : 'ok');
  } catch (e) {
    SY.err = e.name === 'AbortError' ? 'délai dépassé' : (e.message || 'échec'); setSync('err');
  } finally {
    clearTimeout(to); SY.busy = false;
    if (SY.again) { SY.again = false; scheduleSync(1500); }
  }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) scheduleSync(300); });
window.addEventListener('online', () => scheduleSync(300));
setInterval(() => { if (!document.hidden) scheduleSync(0); }, 5 * 60000);

/* ==========================================================================
   SECTION 5 : LOGIQUE (vacances, khôlles, DS, planning, révisions, stats)
   ========================================================================== */
const holidayOf = d => HOLIDAYS.find(h => d >= h[0] && d <= h[1]) || null;
const noClass = d => !!holidayOf(d);                                   // pas de cours ce jour-là
const holTemplate = d => { const h = holidayOf(d); return !!h && !(d === h[0] && dow(d) === 5); };   // journée « vacances »
const COLLES = COLLES_RAW.map((r, i) => ({date: addD(COLLE_WEEKS[i >> 1], r[2]), subject: r[0], who: r[1], times: r[3]}));
const collesOn = d => COLLES.filter(c => c.date === d);
function colleTimes(c) { const out = []; c.times.replace(/(\d{1,2})h(\d{2})?/g, (m, h, mi) => { out.push(+h * 60 + (mi ? +mi : 0)); return m; }); return out; }
// Heure de passage : pour les khôlles à plusieurs créneaux (anglais), on prend le tien (réglable)
function colleStart(c) { const t = colleTimes(c), n = +(S.settings.colleSlot || 3); return t.length > 1 ? t[Math.min(t.length, Math.max(1, n)) - 1] : t[0]; }
function colleSpan(c) { const a = colleStart(c); return [a, a + 20]; }
function dsOn(d) { const e = DS_LIST.find(x => x.d === d); return e ? e.items.filter(i => !i.opt || i.opt === S.settings.option) : []; }
const dsMatches = (item, k) => item.s === k || (item.s === 'lv' && (k === 'anglais' || k === 'espagnol'));
const colleLbl = k => { const n = lname(k); return /^[aeiouéh]/i.test(n) ? `Khôlle d'${n}` : `Khôlle de ${n}`; };
const openErrors = k => live('errors').filter(e => e.subject === k && e.status !== 'fixed').length;

// Révisions espacées : J+1, J+3, J+7, J+15, J+30 après la date où le cours a été vu
function schedFrom(seen) {
  const t0 = today();
  for (let i = 0; i < INTERVALS.length; i++) { const d = addD(seen, INTERVALS[i]); if (d >= t0) return {step: i, next: d}; }
  return {step: INTERVALS.length, next: null};
}
function chapDone(c) {
  const step = (c.step || 0) + 1, t0 = today();
  if (step >= INTERVALS.length) return {step, next: null, last: t0};
  let nx = addD(c.seen || t0, INTERVALS[step]); if (nx <= t0) nx = addD(t0, 1);
  return {step, next: nx, last: t0};
}
const dueChapters = d => live('chapters').filter(c => c.next && c.next <= d);


// --- Semaine de planning : du samedi au vendredi (réglable : lundi au dimanche) ---
const WS = () => (S.settings.weekStart === 'mon' ? 0 : 5);
const periodOf = d => addD(d, -((dow(d) - WS() + 7) % 7));
const periodDays = ps => Array.from({length: 7}, (_, i) => addD(ps, i));
function periodLabel(ps, short) {
  const e = addD(ps, 6), a = pd(ps), b = pd(e);
  const left = `${short ? '' : JOURS[dow(ps)] + ' '}${a.getDate()}${a.getMonth() !== b.getMonth() ? ' ' + MOIS[a.getMonth()] : ''}`;
  return `${left} au ${short ? '' : JOURS[dow(e)] + ' '}${b.getDate()} ${MOIS[b.getMonth()]}`;
}

// --- Ce qui est fixe dans une journée : cours, khôlles, DS ---
function fixedEvents(d) {
  const ev = [];
  if (!noClass(d)) live('edt').filter(b => b.day === dow(d)).forEach(b => ev.push({t: 'class', a: hm(b.start), b: hm(b.end), subject: b.subject, label: b.label || sname(b.subject)}));
  collesOn(d).forEach(c => { const w = colleSpan(c); ev.push({t: 'colle', a: w[0], b: w[1], subject: c.subject, label: colleLbl(c.subject), detail: c.who, c}); });
  const ds = dsOn(d);
  if (ds.length) ev.push({t: 'ds', a: hm('08:00'), b: hm('12:00'), subject: ds[0].s, label: ds[0].s === 'cb' ? 'Concours blanc' : 'DS ' + ds.map(x => sname(x.s)).join(' + '), items: ds});
  return ev.sort((x, y) => x.a - y.a);
}
const blocksOn = d => live('blocks').filter(b => b.date === d).sort((x, y) => hm(x.start) - hm(y.start));
const blockMin = b => Math.max(0, hm(b.end) - hm(b.start));
const blocksIn = (a, b) => live('blocks').filter(x => x.date >= a && x.date <= b);
function plannedBy(a, b) { const o = {}; let tot = 0; blocksIn(a, b).forEach(x => { const m = blockMin(x); o[x.subject] = (o[x.subject] || 0) + m; tot += m; }); return {by: o, tot}; }
const placedFor = (id, skip) => live('blocks').filter(b => b.taskId === id && !(skip && skip.has(b.id))).reduce((a, b) => a + blockMin(b), 0);
const toPlace = () => live('tasks').filter(t => !t.done && t.est > 0).map(t => ({t, rem: t.est - placedFor(t.id)})).filter(x => x.rem >= 15)
  .sort((a, b) => (a.t.due || '9999').localeCompare(b.t.due || '9999'));

// Retire de l'intervalle iv les plages occupées
function subtract(iv, busy) {
  let out = [iv];
  busy.forEach(([x, y]) => { out = out.flatMap(([a, b]) => (y <= a || x >= b) ? [[a, b]] : [[a, Math.min(b, x)], [Math.max(a, y), b]].filter(p => p[1] - p[0] > 0)); });
  return out;
}
const templateFor = d => ((holTemplate(d) ? S.settings.holSlots : S.settings.slots) || [])[dow(d)] || [];

/* Proposition de planning pour une semaine (tu modifies ensuite ce que tu veux).
   Ordre : tâches du cahier de texte avant leur échéance, préparation des khôlles
   (le week-end d'abord, puis une courte reprise 1 à 2 jours avant, jamais le jour même),
   préparation du DS du samedi suivant étalée sur la semaine, révisions espacées,
   puis révision de fond selon tes heures visées par matière.
   mode 'fill' : complète les trous ; 'replace' : refait les créneaux proposés non cochés. */
function propose(ps, mode) {
  const t0 = today(), nm = nowMin(), pe = addD(ps, 6), days = periodDays(ps).filter(d => d >= t0);
  const inPeriod = blocksIn(ps, pe);
  const removeIds = mode === 'replace' ? inPeriod.filter(b => b.auto && !b.done && b.date >= t0 && !(b.date === t0 && hm(b.start) < nm)).map(b => b.id) : [];
  const skip = new Set(removeIds), kept = inPeriod.filter(b => !skip.has(b.id));
  const out = [], warnings = [];

  // 1) Créneaux libres : créneaux types moins cours, khôlles, DS et créneaux déjà posés
  const slots = [];
  days.forEach(d => {
    const busy = fixedEvents(d).map(e => e.t === 'colle' ? [e.a - 15, e.b + 10] : e.t === 'ds' ? [e.a, e.b + 60] : [e.a - 5, e.b + 5]);
    kept.filter(b => b.date === d).forEach(b => busy.push([hm(b.start), hm(b.end)]));
    if (d === t0) busy.push([0, nm + 10]);
    templateFor(d).forEach(([s, e]) => subtract([hm(s), hm(e)], busy).forEach(([a, b]) => { if (b - a >= 30) slots.push({date: d, a, b}); }));
  });
  const free = pred => slots.filter(s => s.b - s.a >= 30 && pred(s));
  const take = (s, want, rec) => {
    let m = Math.min(want, s.b - s.a); if (s.b - s.a - m < 30) m = s.b - s.a;   // pas de miette inutilisable
    m = Math.min(m, 105);
    const blk = Object.assign({date: s.date, start: hhmm(s.a), end: hhmm(s.a + m), done: false, auto: true}, rec);
    s.a += m; out.push(blk); return blk;
  };

  // 2) Tâches avec une durée, à faire avant l'échéance
  live('tasks').filter(t => !t.done && t.est > 0 && (!t.due || t.due <= addD(pe, 7)))
    .sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999') || (b.prio || 2) - (a.prio || 2))
    .forEach(tk => {
      let rem = tk.est - placedFor(tk.id, skip);
      if (rem < 15) return;
      let ok = free(s => !tk.due || s.date < tk.due);
      if (!ok.length && tk.due && tk.due <= pe) ok = free(s => s.date <= tk.due);
      if (tk.due && (tk.prio || 2) < 3 && diffDays(t0, tk.due) > 4) ok.reverse();   // échéance lointaine : proche de la date
      for (const s of ok) {
        if (rem < 15) break;
        if (s.b - s.a < 30 || out.some(b => b.taskId === tk.id && b.date === s.date)) continue;
        const m = Math.floor(Math.min(rem, 90) / 5) * 5;
        rem -= blockMin(take(s, Math.max(m, 30), {subject: tk.subject, title: tk.title, kind: 'task', taskId: tk.id}));
      }
      if (rem >= 15) warnings.push({task: tk, rem});
    });

  // 3) Khôlles de la semaine : on commence le week-end
  periodDays(ps).flatMap(d => collesOn(d)).filter(c => c.date > t0 || (c.date === t0 && colleStart(c) > nm)).forEach(c => {
    const k = c.subject, cd = c.date, lab = `${colleLbl(k)} de ${JOURS[dow(cd)]}`, errs = openErrors(k);
    const s1 = free(s => s.date < cd && dow(s.date) >= 5 && s.b - s.a >= 45)[0] || free(s => s.date <= addD(cd, -2) && s.b - s.a >= 45)[0];
    if (s1) take(s1, 75, {subject: k, title: `${lab} : reprendre le cours et les exercices types`, kind: 'prep-colle'});
    const s2 = free(s => s.date >= addD(cd, -2) && s.date < cd && (!s1 || s.date !== s1.date)).sort((x, y) => y.date.localeCompare(x.date))[0];
    if (s2) take(s2, 45, {subject: k, title: `${lab} : questions de cours${errs ? `, relire ${errs} erreur${errs > 1 ? 's' : ''} du carnet` : ''}`, kind: 'prep-colle'});
  });

  // 4) DS du samedi qui suit : préparation étalée, dès le week-end
  const dsDate = [1, 2, 3, 4, 5, 6, 7].map(i => addD(ps, i)).find(d => dow(d) === 5 && d > t0 && dsOn(d).some(x => x.s !== 'cb' && x.h > 0));
  if (dsDate) dsOn(dsDate).filter(x => x.s !== 'cb' && x.h > 0).forEach(it => {
    const k = it.s === 'lv' ? 'anglais' : it.s, name = it.s === 'lv' ? 'langues' : lname(k);
    const n = it.h >= 3 ? 3 : 2, used = [], picks = [], steps = ['fiches de méthode et cours', 'exercices types', "sujet d'entraînement en temps limité"];
    for (let i = 0; i < n; i++) {
      let c = free(s => s.date < dsDate && s.date <= pe && !used.includes(s.date) && s.b - s.a >= 45);
      if (!c.length) break;
      if (i === 0) { const w = c.filter(s => dow(s.date) >= 5); if (w.length) c = w; }
      else {
        const dist = s => Math.min(...used.map(u => Math.abs(diffDays(u, s.date))));
        c.sort((x, y) => dist(y) - dist(x) || x.date.localeCompare(y.date));
      }
      used.push(c[0].date); picks.push(c[0]);
    }
    picks.sort((x, y) => x.date.localeCompare(y.date) || x.a - y.a)    // les étapes dans l'ordre chronologique
      .forEach((s, i) => take(s, 75, {subject: k, title: `DS de ${name} (${fmtShort(dsDate)}) : ${steps[picks.length === 2 && i === 1 ? 2 : i]}`, kind: 'prep-ds'}));
  });

  // 5) Révisions espacées des chapitres (J+1, J+3…)
  days.forEach((d, i) => {
    const due = live('chapters').filter(c => c.next && (c.next === d || (i === 0 && c.next < d)));
    const by = {}; due.forEach(c => { (by[c.subject] = by[c.subject] || []).push(c); });
    Object.keys(by).forEach(k => {
      const s = free(x => x.date === d)[0]; if (!s) return;
      take(s, by[k].length > 1 ? 45 : 30, {subject: k, title: 'Révision espacée : ' + by[k].map(c => c.name).join(', '), kind: 'rev'});
    });
  });

  // 6) Révision de fond dans ce qui reste, selon les heures visées
  const need = {}, plan = {};
  kept.concat(out).forEach(b => { plan[b.subject] = (plan[b.subject] || 0) + blockMin(b); });
  WORK_KEYS.forEach(k => { need[k] = (S.settings.targets[k] || 0) * 60 - (plan[k] || 0); });
  const perDay = {}; let prev = null;
  slots.sort((x, y) => x.date.localeCompare(y.date) || x.a - y.a).forEach(s => {
    while (s.b - s.a >= 30) {
      const cnt = perDay[s.date] = perDay[s.date] || {};
      let best = null;
      WORK_KEYS.forEach(k => {
        if (!(S.settings.targets[k] > 0)) return;
        const sc = need[k] - 80 * (cnt[k] || 0) - (prev && prev.d === s.date && prev.k === k ? 60 : 0);
        if (!best || sc > best.sc) best = {k, sc};
      });
      if (!best) return;
      const b = take(s, 90, {subject: best.k, title: `Révision ${lname(best.k)} : cours et exercices`, kind: 'rev'});
      need[best.k] -= blockMin(b); cnt[best.k] = (cnt[best.k] || 0) + 1; prev = {d: s.date, k: best.k};
    }
  });
  return {blocks: out.sort((x, y) => x.date.localeCompare(y.date) || hm(x.start) - hm(y.start)), removeIds, warnings};
}

  const items = list.map(b => ({b, a: hm(b.start), e: hm(b.end), lane: 0, lanes: 1})).sort((x, y) => x.a - y.a || y.e - x.e);
  let cluster = [], end = -1;
  const flush = () => { const n = Math.max(1, ...cluster.map(x => x.lane + 1)); cluster.forEach(x => { x.lanes = n; }); cluster = []; };
  items.forEach(it => {
    if (it.a >= end && cluster.length) { flush(); end = -1; }
    const used = cluster.filter(x => x.e > it.a).map(x => x.lane);
    let l = 0; while (used.includes(l)) l++;
    it.lane = l; cluster.push(it); end = Math.max(end, it.e);
  });
  if (cluster.length) flush();
  return items;
}

document.addEventListener('pointerdown', ev => {
  const el = ev.target.closest('.blk'); const area = el && el.closest('#pcols');
  if (!el || !area || ev.button > 0) return;
  const b = findRec('blocks', el.dataset.bid); if (!b) return;
  const days = area.dataset.days.split(',');
  DRAG = {id: b.id, el, area: area.getBoundingClientRect(), days, mode: ev.target.closest('[data-grip]') ? 'resize' : 'move',
    x0: ev.clientX, y0: ev.clientY, a: hm(b.start), e: hm(b.end), di: days.indexOf(b.date), moved: false};
  DRAG.na = DRAG.a; DRAG.ne = DRAG.e; DRAG.ndi = DRAG.di;

document.addEventListener('pointermove', ev => {
  const D = DRAG; if (!D) return;
  const dx = ev.clientX - D.x0, dy = ev.clientY - D.y0;

  ev.preventDefault();

    D.ndi = n > 1 ? clampN(D.di + Math.round(dx / (D.area.width / n)), 0, n - 1) : D.di;

  } else {

// --- Partage et impression : on dessine le planning de la semaine dans une image ---
const HEX = {maths: '#C8524A', physique: '#6E7C8E', chimie: '#8F5BA6', sii: '#C98F2A', francais: '#4F78D0', anglais: '#3489BF', espagnol: '#A8902A', info: '#6670B8', eps: '#46936E', lv: '#3489BF', cb: '#6E6E73', autre: '#6E6E73'};
const tint = (hex, f) => { const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255, m = c => Math.round(c + (255 - c) * f); return `rgb(${m(r)},${m(g)},${m(b)})`; };
function drawPlanning(ps) {
  const W = 2339, H = 1654, M = 60, top = 150, left = M + 70, days = periodDays(ps);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d'), F = '-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#1C1C1E'; x.font = `700 46px ${F}`; x.fillText(`Planning du ${periodLabel(ps)}`, M, 82);
  const plan = plannedBy(ps, addD(ps, 6));
  x.font = `400 26px ${F}`; x.fillStyle = '#6E6E73';
  x.fillText(`${fmtDur(plan.tot)} de travail planifiées · ` + WORK_KEYS.filter(k => plan.by[k]).map(k => `${sname(k)} ${fmtH(Math.round(plan.by[k] / 15) * 15 / 60)}`).join(' · '), M, 124);
  const cw = (W - left - M) / 7, gh = H - top - 70, pm = gh / (GRID_B - GRID_A);
  days.forEach((d, i) => {
    const cx = left + i * cw;
    if (noClass(d)) { x.fillStyle = '#F7F7F5'; x.fillRect(cx, top, cw, gh); }
    x.fillStyle = '#1C1C1E'; x.font = `600 26px ${F}`; x.textAlign = 'center';
    x.fillText(`${JOURS3[dow(d)]} ${pd(d).getDate()}`, cx + cw / 2, top - 16); x.textAlign = 'left';
  });
  x.strokeStyle = '#E5E5EA'; x.lineWidth = 1.5;
  for (let h = GRID_A / 60; h <= GRID_B / 60; h++) {
    const y = top + (h * 60 - GRID_A) * pm;
    x.beginPath(); x.moveTo(left, y); x.lineTo(W - M, y); x.stroke();
    x.fillStyle = '#8E8E93'; x.font = `400 21px ${F}`; x.fillText(`${h}h`, M, y + 7);
  }
  for (let i = 0; i <= 7; i++) { x.beginPath(); x.moveTo(left + i * cw, top); x.lineTo(left + i * cw, top + gh); x.stroke(); }
  const box = (d, i, a, b, fill, stroke, bar, title, sub, dashed) => {
    const bx = left + i * cw + 4, by = top + (clampN(a, GRID_A, GRID_B) - GRID_A) * pm + 2, bw = cw - 8, bh = Math.max(20, (clampN(b, GRID_A, GRID_B) - clampN(a, GRID_A, GRID_B)) * pm - 4);
    x.fillStyle = fill; x.beginPath(); x.roundRect ? x.roundRect(bx, by, bw, bh, 8) : x.rect(bx, by, bw, bh); x.fill();
    if (stroke) { x.save(); x.strokeStyle = stroke; x.lineWidth = 2; if (dashed) x.setLineDash([8, 6]); x.stroke(); x.restore(); }
    if (bar) { x.fillStyle = bar; x.fillRect(bx, by, 6, bh); }
    x.save(); x.beginPath(); x.rect(bx, by, bw, bh); x.clip();
    const lines = []; let line = ''; x.font = `600 21px ${F}`;
    String(title).split(' ').forEach(wd => { const t = line ? line + ' ' + wd : wd; if (x.measureText(t).width > bw - 22 && line) { lines.push(line); line = wd; } else line = t; });
    if (line) lines.push(line);
    const max = Math.max(1, Math.floor((bh - (sub ? 26 : 6)) / 25));
    x.fillStyle = '#1C1C1E'; lines.slice(0, max).forEach((l, k) => x.fillText(k === max - 1 && lines.length > max ? l + '…' : l, bx + 14, by + 26 + k * 25));
    if (sub && bh > 50) { x.font = `400 19px ${F}`; x.fillStyle = '#6E6E73'; x.fillText(sub, bx + 14, by + 26 + Math.min(lines.length, max) * 25); }
    x.restore();
  };
  days.forEach((d, i) => {
    fixedEvents(d).forEach(e => {
      if (e.t === 'class') box(d, i, e.a, e.b, '#F2F2F4', null, null, e.label, '');
      else if (e.t === 'colle') box(d, i, e.a, e.b + 10, tint(HEX[e.subject] || HEX.autre, .86), HEX[e.subject] || HEX.autre, null, e.label + ' ' + fmtT(e.a), '', true);
      else box(d, i, e.a, e.b, '#3A3A3C', null, null, '', '');
      if (e.t === 'ds') { x.fillStyle = '#fff'; x.font = `600 21px ${F}`; x.fillText(e.label, left + i * cw + 18, top + (e.a - GRID_A) * pm + 30); }
    });
    blocksOn(d).forEach(b => { const c = HEX[b.subject] || HEX.autre; box(d, i, hm(b.start), hm(b.end), tint(c, .82), null, c, (b.done ? '✓ ' : '') + b.title, `${fmtT(hm(b.start))}–${fmtT(hm(b.end))}`); });
  });
  return cv;
}

function advancePhases(now) {

function chartSvg(list) {
  const W = 340, H = 170, L = 26, R = 10, Tp = 10, B = 22;
  if (!list.length) return '';
  const ds = list.map(g => pd(g.date).getTime()), mn = Math.min(...ds), mx = Math.max(...ds);
  const X = t => L + (mx === mn ? (W - L - R) / 2 : (t - mn) / (mx - mn) * (W - L - R)), Y = v => Tp + (1 - Math.min(20, v) / 20) * (H - Tp - B);
  let grid = ''; [0, 5, 10, 15, 20].forEach(v => { grid += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`; });
  const run = []; let s = 0, c = 0;
  list.forEach(g => { const v = n20(g), w = +g.coef > 0 ? +g.coef : 0; if (v != null && w > 0) { s += v * w; c += w; } run.push(c ? s / c : null); });
  const pts = list.map((g, i) => run[i] == null ? null : `${X(pd(g.date).getTime()).toFixed(1)},${Y(run[i]).toFixed(1)}`).filter(Boolean);
  const dots = list.map(g => { const v = n20(g); return v == null ? '' : `<circle cx="${X(pd(g.date).getTime()).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="5" fill="${col(g.subject)}" stroke="var(--surface)" stroke-width="2"/>`; }).join('');
  const lab = `<text x="${L}" y="${H - 4}">${esc(fmtShort(list[0].date))}</text><text x="${W - R}" y="${H - 4}" text-anchor="end">${esc(fmtShort(list[list.length - 1].date))}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe des notes">${grid}${pts.length > 1 ? `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : ''}${dots}${lab}</svg><div class="sub">Points : chaque note. Trait : moyenne pondérée cumulée.</div>`;
}

function doImport(text) {
  let o; try { o = JSON.parse(text); } catch (e) { toast('Fichier illisible : ce n\'est pas du JSON valide'); return; }
  const core = o && o.core ? o.core : (o && (o.tasks || o.edt) ? o : null);
  if (!core) { toast('Fichier non reconnu'); return; }
  const imp = migrate(core, o.time), now = Date.now();
  imp.settings.u = now;

  closeSheet(); replaceState(merge(S, imp)); scheduleSync(300); toast('Données importées');
}

      s.errors.forEach(e => { if (!e.del && e.chapter === id) { e.chapter = ''; e.u = Date.now(); } });
    }); break;
    case 'chap-ok': { const c = findRec('chapters', id); if (c) { updRec('chapters', id, chapDone(c)); toast((c.step || 0) + 1 >= INTERVALS.length ? 'Cycle de révisions terminé' : 'Prochaine révision programmée'); } break; }
    case 'chap-again': { const c = findRec('chapters', id); if (c) { updRec('chapters', id, {next: addD(today(), 1)}); toast('À revoir demain'); } break; }
    case 'chap-restart': { const t0 = today(); closeSheet(); updRec('chapters', id, Object.assign({seen: t0}, schedFrom(t0))); toast('Révisions relancées'); break; }
    case 'err-filter': UI.ef = el.dataset.f; render(); break;
    case 'err-edit': { const e = findRec('errors', id); if (e) openSheet(errForm(e)); break; }
    case 'err-toggle': { ev.stopPropagation(); const e = findRec('errors', id); if (e) updRec('errors', id, {status: e.status === 'fixed' ? 'open' : 'fixed'}); break; }
    case 'err-del': closeSheet(); delRec('errors', id); break;
    case 'err-from-grade': { const g = findRec('grades', id); if (!g) break; UI.tab = 'suivi'; UI.suivi = 'err'; render();
      openSheet(errForm({subject: g.subject, date: g.date, notion: `${g.kind === 'Colle' ? 'Khôlle' : g.kind} du ${fmtShort(g.date)} : `})); break; }
    case 'grade-filter': UI.gradeFilter = el.dataset.k; render(); break;
    case 'grade-edit': { const g = findRec('grades', id); if (g) openSheet(gradeForm(g)); break; }
    case 'grade-del': closeSheet(); delRec('grades', id); break;
    case 'chrono-view': UI.chronoView = el.dataset.v; render(); break;
    case 'hist-open': UI.tab = 'timer'; UI.chronoView = 'hist'; UI.hMode = 'week'; UI.hRef = today(); render(); window.scrollTo(0, 0); break;
    case 'h-mode': UI.hMode = el.dataset.v; render(); break;
    case 'h-prev': case 'h-next': { const k = a === 'h-prev' ? -1 : 1;
      if (UI.hMode === 'month') { const d = pd(UI.hRef); UI.hRef = ymd(new Date(d.getFullYear(), d.getMonth() + k, 1, 12)); } else UI.hRef = addD(UI.hRef, 7 * k);
      render(); break; }
    case 'csv': exportCSV(); break;
    case 'timer-pick': UI.timerSubject = el.dataset.k; saveUI(); render(); break;
    case 'timer-mode': UI.timerMode = el.dataset.m; saveUI(); render(); break;
    case 'timer-start': startTimer(); break;
    case 'timer-toggle': toggleTimer(); break;
    case 'timer-stop': stopTimer(); break;
    case 'session-new': openSheet(sessionForm()); break;
    case 'sess-edit': { const r = findRec('sessions', id); if (r) openSheet(sessionForm(r)); break; }
    case 'sess-del': closeSheet(); delRec('sessions', id); toast('Session supprimée'); break;
    case 'edt-list': openSheet(edtList()); break;
    case 'edt-new': openSheet(edtForm()); break;
    case 'edt-edit': { const b = findRec('edt', id); if (b) openSheet(edtForm(b)); break; }
    case 'edt-del': delRec('edt', id); openSheet(edtList()); break;
    case 'sync-save': saveSyncCfg(); break;
    case 'sync-copy': { const code = CFG.url + '#' + CFG.key; try { navigator.clipboard.writeText(code).then(() => toast('Code copié'), () => toast(code)); } catch (e) { toast(code); } break; }
    case 'sync-off': CFG = null; lsDel(LS_CFG); setSync('local'); closeSheet(); toast('Cet appareil n\'est plus synchronisé'); render(); break;
    case 'export': doExport(); break;
    case 'import': openSheet(importForm()); break;
    case 'copy-exp': { const t = $('#exp'); if (t) { t.select(); try { navigator.clipboard.writeText(t.value).then(() => toast('Copié')); } catch (e) { document.execCommand('copy'); toast('Copié'); } } break; }
  }
});
document.addEventListener('keydown', ev => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('[role=button][data-act]')) { ev.preventDefault(); ev.target.click(); } });
document.addEventListener('change', ev => {
  const f = ev.target.closest('form'); if (!f) return;
  if (f.dataset.form === 'err' && ev.target.name === 'subject') f.elements.chapter.innerHTML = chapOptions(ev.target.value, '');
  if (f.dataset.form === 'blk' && ev.target.name === 'taskId') {    // choisir une tâche remplit matière et intitulé
    const t = findRec('tasks', ev.target.value);
    if (t) { if (WORK_KEYS.includes(t.subject) || t.subject === 'autre') f.elements.subject.value = t.subject; f.elements.title.value = t.title; }
  }
  if (f.dataset.form === 'blk' && ev.target.name === 'start' && f.elements.end && ev.target.dataset.prev) { /* rien : la fin reste libre */ }
});
document.addEventListener('submit', ev => {
  const f = ev.target.closest('form[data-form]'); if (!f) return;
  ev.preventDefault();
  const fd = Object.fromEntries(new FormData(f).entries()), id = f.dataset.id, kind = f.dataset.form;
  if (kind === 'task') {
    const rec = {title: String(fd.title).trim(), subject: fd.subject, due: fd.due || null, est: +fd.est || 0, prio: +fd.prio || 2, notes: fd.notes || ''};
    if (!rec.title) return;
    closeSheet();
    if (id) updRec('tasks', id, rec); else { addRec('tasks', Object.assign({done: false, created: Date.now()}, rec)); toast(rec.est ? 'Tâche ajoutée : place-la dans ton planning' : 'Rappel ajouté'); }
  } else if (kind === 'blk') {
    const a = hm(fd.start || '00:00'), e = hm(fd.end || '00:00');
    if (!(e > a)) { toast('L\'heure de fin doit suivre celle du début'); return; }
    const rec = {date: fd.date, start: fd.start, end: fd.end, subject: fd.subject, taskId: fd.taskId || '', auto: false,
      title: String(fd.title || '').trim() || `Révision ${lname(fd.subject)} : cours et exercices`};
    rec.kind = rec.taskId ? 'task' : 'rev';
    if (id) { const old = findRec('blocks', id); if (old && old.kind && !rec.taskId && old.kind !== 'task') rec.kind = old.kind; rec.done = !!fd.done; }
    closeSheet();
    if (id) updRec('blocks', id, rec); else addRec('blocks', Object.assign({done: false}, rec));
  } else if (kind === 'chap') {
    const rec = {name: String(fd.name).trim(), subject: fd.subject, seen: fd.seen || today(), status: +fd.status || 0, conf: +fd.conf || 3, notes: fd.notes || ''};
    if (!rec.name) return;
    const old = id && findRec('chapters', id);
    if (!old || old.seen !== rec.seen) Object.assign(rec, schedFrom(rec.seen));
    closeSheet();
    if (old) updRec('chapters', id, rec); else { addRec('chapters', rec); toast(rec.next ? `Première révision : ${relDay(rec.next).toLowerCase()}` : 'Chapitre ajouté'); }
  } else if (kind === 'err') {
    const rec = {subject: fd.subject, chapter: fd.chapter || '', notion: String(fd.notion).trim(), wrong: fd.wrong || '', fix: fd.fix || '', date: fd.date || today(), status: fd.status === 'fixed' ? 'fixed' : 'open'};
    if (!rec.notion) return;
    closeSheet();
    if (id) updRec('errors', id, rec); else { addRec('errors', rec); toast('Erreur ajoutée au carnet'); }
  } else if (kind === 'grade') {
    const rec = {subject: fd.subject, kind: fd.kind, date: fd.date, score: num(fd.score), max: num(fd.max) || 20, coef: num(fd.coef) || 1, comment: fd.comment || ''};
    if (isNaN(rec.score) || rec.score < 0) { toast('Note invalide'); return; }
    closeSheet();
    if (id) updRec('grades', id, rec);
    else { const nid = uid(); commit(s => { s.grades.push(Object.assign({id: nid, u: Date.now()}, rec)); }); afterGrade(Object.assign({id: nid}, rec)); }
  } else if (kind === 'session') {
    const m = Math.round(num(fd.min)); if (!(m > 0)) return;
    const rec = {date: fd.date || today(), subject: fd.subject, min: m, start: fd.start || '', end: fd.start ? hhmm(Math.min(24 * 60 - 1, hm(fd.start) + m)) : ''};
    closeSheet();
    if (id) updRec('sessions', id, rec); else { addRec('sessions', rec); toast(`Session ajoutée : ${fmtDur(m)}`); }
  } else if (kind === 'edt') {
    if (hm(fd.end) <= hm(fd.start)) { toast('L\'heure de fin doit suivre celle du début'); return; }
    const rec = {label: String(fd.label).trim(), day: +fd.day, subject: fd.subject, start: fd.start, end: fd.end};
    if (id) updRec('edt', id, rec); else addRec('edt', rec);
    openSheet(edtList());
  } else if (kind === 'settings') {
    const targets = {}, coefs = {};
    WORK_KEYS.forEach(k => { const t = num(fd['t_' + k]), c = num(fd['c_' + k]); targets[k] = t >= 0 ? t : 0; coefs[k] = c > 0 ? c : 1; });
    closeSheet();
    setSettings({name: String(fd.name).trim() || 'Antoine', option: fd.option, colleSlot: +fd.colleSlot || 3, weekStart: fd.weekStart === 'mon' ? 'mon' : 'sat',
      targets: Object.assign({}, S.settings.targets, targets), coefs: Object.assign({}, S.settings.coefs, coefs)});
    UI.ps = null; toast('Réglages enregistrés');
  } else if (kind === 'import') {
    const file = $('#impfile') && $('#impfile').files[0];
    if (file) { const r = new FileReader(); r.onload = () => doImport(String(r.result)); r.readAsText(file); }
    else if (fd.json && String(fd.json).trim()) doImport(fd.json);
    else toast('Choisis un fichier ou colle le contenu');
  }
});
let lastWide = isWide();
window.addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(() => { if (isWide() !== lastWide) { lastWide = isWide(); render(); } }, 150); });
setInterval(() => { if (UI.tab === 'plan' && !DRAG && !$('#sheet.open')) { const n = $('.now'); if (n) n.style.top = (nowMin() - GRID_A) * ppm() + 'px'; } }, 60000);
/* ==========================================================================
   SECTION 7 : DÉMARRAGE
   ========================================================================== */
render();
if (CFG) scheduleSync(400); else setSync('local');
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
