<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EDF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D131B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cahier">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Cahier de bord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Saira+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* ==========================================================================
   STYLES : jetons de design, puis composants
   ========================================================================== */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface2:#F4F6F9; --ink:#0F1B2D; --muted:#5A6A7E; --line:#D7DDE5;
  --accent:#2F55D4; --accent-ink:#FFFFFF; --accent-soft:#E3E9FB; --danger:#C23B3B; --ok:#1F8A5B; --warn:#B7791F;
  --shadow:0 1px 2px rgba(15,27,45,.06),0 6px 18px rgba(15,27,45,.06);
  --flip-bg:#1B2433; --flip-ink:#F2F5F9; --flip-cut:#0B111A;
  /* couleurs de matières : reprises de ton agenda pour que l'œil s'y retrouve */
  --c-maths:#C9524D; --c-physique:#6F7B8B; --c-chimie:#9557A7; --c-sii:#D99A2B; --c-francais:#5B83E8;
  --c-anglais:#3F9AD6; --c-espagnol:#C4A82F; --c-info:#7A82C4; --c-eps:#4FA57C; --c-lv:#3F9AD6; --c-cb:#8A94A3; --c-autre:#8A94A3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D131B; --surface:#151D28; --surface2:#1B2532; --ink:#E9EEF5; --muted:#93A1B4; --line:#263241;
    --accent:#7F9CFF; --accent-ink:#0D131B; --accent-soft:#1E2A4A; --danger:#EE7B7B; --ok:#52C793; --warn:#E3B15A;
    --shadow:none; --flip-bg:#222D3F; --flip-cut:#0D131B;
    --c-maths:#E8746F; --c-physique:#97A3B4; --c-chimie:#B67DC8; --c-sii:#EDB24A; --c-francais:#7FA2FF;
    --c-anglais:#62B4EC; --c-espagnol:#DDC55A; --c-info:#9BA3E0; --c-eps:#6CC29A; --c-lv:#62B4EC;
  }
}
:root[data-theme="dark"]{
  --bg:#0D131B; --surface:#151D28; --surface2:#1B2532; --ink:#E9EEF5; --muted:#93A1B4; --line:#263241;
  --accent:#7F9CFF; --accent-ink:#0D131B; --accent-soft:#1E2A4A; --danger:#EE7B7B; --ok:#52C793; --warn:#E3B15A;
  --shadow:none; --flip-bg:#222D3F; --flip-cut:#0D131B;
  --c-maths:#E8746F; --c-physique:#97A3B4; --c-chimie:#B67DC8; --c-sii:#EDB24A; --c-francais:#7FA2FF;
  --c-anglais:#62B4EC; --c-espagnol:#DDC55A; --c-info:#9BA3E0; --c-eps:#6CC29A; --c-lv:#62B4EC;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-tap-highlight-color:transparent;min-height:100vh}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:"Saira Semi Condensed","Public Sans",system-ui,sans-serif;margin:0;letter-spacing:.005em}
h1{font-size:30px;line-height:1.05;font-weight:700}
h2{font-size:22px;font-weight:600}
h3{font-size:18px;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ic.fill{fill:currentColor;stroke:none}

.wrap{max-width:720px;margin:0 auto;padding:0 16px}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.top .wrap{display:flex;align-items:center;justify-content:space-between;min-height:60px;gap:12px}
.top h1{font-size:26px}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--muted);position:relative}
.iconbtn:active{background:var(--surface2)}
.syncdot{position:absolute;right:8px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--muted);border:2px solid var(--bg)}
.syncdot[data-m="ok"]{background:var(--ok)} .syncdot[data-m="err"]{background:var(--warn)}
.sub{color:var(--muted);font-size:14px}
.sec{margin:26px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{font-size:20px}
.link{color:var(--accent);font-weight:600;font-size:14px;min-height:32px}

.card{background:var(--surface);border-radius:var(--r,18px);box-shadow:var(--shadow);padding:16px;border:1px solid var(--line)}
.card+.card{margin-top:10px}
.stack>*+*{margin-top:10px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c,var(--c-autre))}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}

/* barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:12px;font-weight:600;position:relative}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab .live{position:absolute;top:10px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--danger);border:2px solid var(--surface)}

/* boutons, champs */
.btn{min-height:48px;padding:0 20px;border-radius:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface2);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:25;width:58px;height:58px;border-radius:20px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 22px rgba(20,40,120,.28)}
.fab svg{width:26px;height:26px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sm{min-height:34px;font-size:13px;padding:0 12px}
.fld{display:block;margin:0 0 14px}
.fld>span{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:16px}
.fld textarea{min-height:88px;resize:vertical}
.fld2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* feuille modale */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
.sheet-back{position:absolute;inset:0;background:rgba(8,14,24,.5)}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;max-height:90vh;overflow:auto;background:var(--surface);
  border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-panel h2{margin-bottom:16px}
.sheet-actions{display:flex;gap:10px;margin-top:6px}
.sheet-actions .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:60;max-width:90vw;box-shadow:var(--shadow)}

/* accueil */
.hello{padding:14px 0 4px}
.hello .sub{margin-top:4px}
.gauge{display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;position:relative}
.gauge svg{width:100%;max-width:330px;height:auto;overflow:visible}
.gauge .read{position:absolute;bottom:6px;text-align:center}
.gauge .read b{font:700 34px/1 "Saira Semi Condensed",sans-serif}
.gauge .read span{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.streak{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--warn);font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px;min-width:0}
.subj-row{display:grid;grid-template-columns:92px 1fr 88px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.subj-row .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.next{border-left:6px solid var(--c,var(--accent))}
.rem{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.rem:first-child{border-top:0}
.rem .when{flex:none;min-width:84px;font-size:13px;font-weight:700}
.rem .when.late{color:var(--danger)}
.rem .when.soon{color:var(--warn)}

/* semaine */
.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0 14px}
.dchip{min-height:64px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);font-weight:600;position:relative}
.dchip b{font:700 20px/1 "Saira Semi Condensed",sans-serif;color:var(--ink)}
.dchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dchip[aria-pressed="true"] b{color:var(--bg)}
.dchip.today::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.dchip .marks{display:flex;gap:3px;height:5px}
.dchip .marks i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.wkbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
.wkbar h2{font-size:19px;text-align:center}
.ev{display:grid;grid-template-columns:54px 1fr;gap:10px;margin:0 0 8px}
.ev .t{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:12px;text-align:right;line-height:1.25}
.ev .b{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c,var(--c-autre));border-radius:14px;padding:11px 13px;min-width:0}
.ev.class .b{background:transparent;border-style:dashed;border-left-style:solid;padding:9px 13px}
.ev.class .b .n{font-weight:600}
.ev.work .b{box-shadow:var(--shadow);padding:13px}
.ev.work.done .b{opacity:.55}
.ev.blocked .b{background:var(--surface2)}
.ev .h{display:flex;align-items:center;gap:10px;justify-content:space-between}
.ev .n{font-weight:700}
.seg{display:flex;gap:10px;align-items:flex-start;padding:8px 0 0;font-size:15px}
.seg .m{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.seg .why{display:block;color:var(--muted);font-size:13px}
.check{width:32px;height:32px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;background:var(--surface)}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.check svg{width:18px;height:18px;stroke-width:3}
.banner{background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:14px;margin:6px 0 12px}
.warnbox{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));border-radius:14px;padding:12px 14px;font-size:14px;margin:0 0 12px}
.dsline{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* tâches */
.task{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;text-align:left;width:100%}
.task .tt{flex:1;min-width:0}
.task .t1{font-weight:600;overflow-wrap:anywhere}
.task .t2{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:3px}
.task.done .t1{text-decoration:line-through;color:var(--muted)}
.task .late{color:var(--danger);font-weight:700}
.empty{text-align:center;padding:38px 18px;color:var(--muted)}
.empty svg{width:46px;height:46px;margin-bottom:8px;color:var(--line)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* chrono */
.clock{display:flex;justify-content:center;align-items:center;gap:clamp(4px,1.4vw,10px);margin:18px 0 8px;--w:clamp(34px,10.5vw,62px);--h:calc(var(--w)*1.42);--rr:9px}
.clock .grp{display:flex;gap:4px}
.clock .colon{font:700 clamp(24px,8vw,44px)/1 "Saira Semi Condensed",sans-serif;color:var(--muted);padding-bottom:4px}
.fd{position:relative;width:var(--w);height:var(--h);perspective:500px;color:var(--flip-ink)}
.fd>div{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--flip-bg);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fd .u,.fd .fu{top:0;border-radius:var(--rr) var(--rr) 0 0;transform-origin:bottom;border-bottom:1px solid var(--flip-cut)}
.fd .l,.fd .fl{bottom:0;border-radius:0 0 var(--rr) var(--rr);transform-origin:top}
.fd b{position:absolute;left:0;right:0;height:200%;display:flex;align-items:center;justify-content:center;font:700 calc(var(--w)*1.05)/1 "Saira Semi Condensed",sans-serif;font-variant-numeric:tabular-nums}
.fd .u b,.fd .fu b{top:0}
.fd .l b,.fd .fl b{bottom:0}
.fd .fu,.fd .fl{visibility:hidden}
.fd.go .fu{visibility:visible;animation:fu .25s ease-in forwards}
.fd.go .fl{visibility:visible;animation:fl .25s ease-out .25s both}
@keyframes fu{to{transform:rotateX(-90deg)}}
@keyframes fl{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
@media (prefers-reduced-motion:reduce){.fd.go .fu,.fd.go .fl{animation:none;visibility:hidden}.sheet-panel{animation:none}}
.phase{text-align:center;font-weight:700;margin-bottom:12px;min-height:24px}
.ctrls{display:flex;gap:10px;justify-content:center;margin:8px 0 4px}
.ctrls .btn{min-width:150px;min-height:56px;font-size:17px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface2);padding:4px;border-radius:14px;border:1px solid var(--line)}
.seg3 button{min-height:42px;border-radius:10px;font-weight:600;font-size:14px}
.seg3 button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.seg3 button:disabled{opacity:.5}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px;margin-top:8px}
.days7 .col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px;font-size:12px;color:var(--muted)}
.days7 .stk{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:8px;overflow:hidden;background:var(--surface2)}
.days7 .stk i{display:block;background:var(--c)}
.days7 .col.today{color:var(--ink);font-weight:700}

/* notes */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi b{display:block;font:700 34px/1 "Saira Semi Condensed",sans-serif}
.kpi span{font-size:13px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px "Public Sans",sans-serif}
.gr{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;width:100%;text-align:left}
.gr .sc{font:700 22px/1 "Saira Semi Condensed",sans-serif;min-width:66px}
.gr .sc small{font-size:12px;color:var(--muted);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.subj-row{grid-template-columns:78px 1fr 74px}}

/* ajouts V2 */
.fab[hidden]{display:none}
.syncdot[data-m="busy"]{background:var(--accent)} .syncdot[data-m="warn"]{background:var(--warn)} .syncdot[data-m="err"]{background:var(--danger)}
.mini{min-height:38px;padding:0 12px;border-radius:10px;font-weight:600;font-size:13px;background:var(--surface2);border:1px solid var(--line);flex:none}
.mini.ok{background:var(--ok);color:#fff;border-color:transparent}
.stars{color:var(--warn);letter-spacing:1px;font-size:14px;flex:none}
.x{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.x svg{width:18px;height:18px}
.banner .link{display:inline;min-height:0;padding:0}
h2.row{display:flex}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <h1 id="title">Cahier de bord</h1>
  <button class="iconbtn" data-act="settings" aria-label="Réglages et synchronisation"><span id="ic-set"></span><i class="syncdot" id="syncdot" data-m="local"></i></button>
</div></div>
<main><div class="wrap" id="view"></div></main>
<button class="fab" id="fab" data-act="fab" aria-label="Ajouter" hidden></button>
<nav class="tabs" aria-label="Navigation"><div class="in" id="tabs"></div></nav>
<div id="sheet"></div>
<div id="toast-host"></div>
<script>
'use strict';
/* Cahier de bord PCSI, version 2.0
   Sections : 1 données de référence, 2 outils, 3 état et fusion, 4 synchro Google,
   5 logique (planning, révisions), 6 interface, 7 démarrage. */
const APP_VERSION = '2.0.1';
/* ==========================================================================
   SECTION 1 : DONNÉES DE RÉFÉRENCE (emploi du temps, colloscope, DS)
   ========================================================================== */
const SCHEMA = 2;   // version du schéma de données ; toute évolution passe par migrate()
const SUBJ = {
  maths:{n:'Maths'}, physique:{n:'Physique'}, chimie:{n:'Chimie'}, sii:{n:'SII'}, info:{n:'Info'},
  francais:{n:'Français'}, anglais:{n:'Anglais'}, espagnol:{n:'Espagnol'}, eps:{n:'EPS'},
  lv:{n:'Langues'}, cb:{n:'Concours blanc'}, autre:{n:'Autre'}
};
const WORK_KEYS = ['maths','physique','chimie','sii','info','francais','anglais','espagnol'];
const DEFAULT_TARGETS = {maths:7, physique:7, chimie:3, sii:2, info:2, francais:2, anglais:2, espagnol:1}; // heures par semaine
const col = k => `var(--c-${SUBJ[k] ? k : 'autre'})`;
const sname = k => (SUBJ[k] ? SUBJ[k].n : 'Autre');

// Emploi du temps (lu sur ta capture d'agenda, jour 0 = lundi). Modifiable dans Réglages.
const DEFAULT_EDT = [
  [0,'08:00','10:00','maths','Mathématiques'],[0,'10:25','11:20','sii','SII'],[0,'13:30','15:20','maths','TD Maths'],

    tasks: [], grades: [], sessions: [], chapters: [], errors: [], slotDone: {}

}

function normalize(s) {
  const d = defaults();

  const st = (s.settings && typeof s.settings === 'object') ? s.settings : {};
  m.settings = Object.assign({}, d.settings, st, {u: +st.u || 0});
  m.settings.targets = Object.assign({}, d.settings.targets, st.targets || {});
  m.settings.coefs = Object.assign({}, st.coefs || {});
  m.settings.slots = Array.isArray(st.slots) && st.slots.length === 7 ? st.slots : d.settings.slots;
  COLS.forEach(k => { m[k] = Array.isArray(s[k]) ? s[k].filter(r => r && r.id).map(r => Object.assign({}, r, {u: +r.u || 0})) : d[k]; });
  m.slotDone = {};
  const sd = (s.slotDone && typeof s.slotDone === 'object') ? s.slotDone : {};
  Object.keys(sd).forEach(k => { const v = sd[k]; m.slotDone[k] = (v && typeof v === 'object') ? {v: !!v.v, u: +v.u || 0} : {v: !!v, u: 0}; });

}
// Migration V1 -> V2 : horodatage des enregistrements, temps de travail converti en sessions
function migrate(core, time) {

    const u = core.updatedAt || Date.now();
    core = Object.assign({}, core);
    core.settings = Object.assign({}, core.settings || {}, {u});
    ['edt', 'tasks', 'grades'].forEach(k => { if (Array.isArray(core[k])) core[k] = core[k].map(r => Object.assign({}, r, {u})); });
    const sd = {}; Object.keys(core.slotDone || {}).forEach(k => { sd[k] = {v: !!core.slotDone[k], u}; }); core.slotDone = sd;
    core.sessions = [];
    const by = (time && time.byDay) || {};
    Object.keys(by).forEach(d => Object.keys(by[d] || {}).forEach(k => {
      const m = +by[d][k]; if (m > 0) core.sessions.push({id: `m-${d}-${k}`, u: (time && time.updatedAt) || u, date: d, subject: k, min: m});

  Object.keys(b.slotDone).forEach(k => { if (!out.slotDone[k] || b.slotDone[k].u > out.slotDone[k].u) out.slotDone[k] = b.slotDone[k]; });

let CFG = loadJSON(LS_CFG);      // {url, key} : réglé une fois par appareil

function syncText() {
  if (!CFG) return 'Synchro non configurée : données sur cet appareil uniquement';
  if (SY.mode === 'busy') return 'Synchronisation…';
  if (SY.mode === 'err') return 'Échec de la synchro : ' + SY.err;
  const at = SY.last ? `Synchronisé à ${fmtT(new Date(SY.last).getHours() * 60 + new Date(SY.last).getMinutes())}` : 'Synchro prête';
  if (SY.mode === 'warn') return at + '. Google Tasks ne répond pas : ' + tasksErr(SY.tasks && SY.tasks.error);
  return at + (SY.tasks && SY.tasks.list ? `, Google Tasks lié (liste ${SY.tasks.list})` : '');
}
function tasksErr(e) {
  if (e === 'service_off') return 'ajoute le service Google Tasks API dans le script';
  return e || 'erreur inconnue';
}

  if (!CFG) return;
  clearTimeout(SY.timer); SY.timer = setTimeout(syncNow, delay == null ? 2500 : delay);
}
async function syncNow() {
  if (!CFG || !CFG.url) { setSync('local'); return; }
  if (SY.busy) { SY.again = true; return; }
  if (navigator.onLine === false) { SY.err = 'hors ligne'; setSync('err'); return; }
  SY.busy = true; setSync('busy');
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 30000);
  try {

    const res = await fetch(CFG.url, {method: 'POST', body: JSON.stringify({key: CFG.key, v: SCHEMA, state: S}), signal: ctl.signal, redirect: 'follow'});
    let j; try { j = await res.json(); } catch (e) { throw new Error('réponse illisible : vérifie l\'adresse et l\'accès « Tout le monde »'); }
    if (!j.ok) throw new Error(j.error === 'bad_key' ? 'clé refusée' : j.error === 'busy' ? 'serveur occupé, nouvel essai bientôt' : String(j.error));

    SY.err = e.name === 'AbortError' ? 'délai dépassé' : (e.message || 'échec'); setSync('err');

    clearTimeout(to); SY.busy = false;
    if (SY.again) { SY.again = false; scheduleSync(1500); }
  }

// Révisions espacées : J+1, J+3, J+7, J+15, J+30 après la date où le cours a été vu
function schedFrom(seen) {
  const t0 = today();
  for (let i = 0; i < INTERVALS.length; i++) { const d = addD(seen, INTERVALS[i]); if (d >= t0) return {step: i, next: d}; }
  return {step: INTERVALS.length, next: null};
}
function chapDone(c) {
  const step = (c.step || 0) + 1, t0 = today();
  if (step >= INTERVALS.length) return {step, next: null, last: t0};
  let nx = addD(c.seen || t0, INTERVALS[step]); if (nx <= t0) nx = addD(t0, 1);
  return {step, next: nx, last: t0};
}
const dueChapters = d => live('chapters').filter(c => c.next && c.next <= d);

function getPlan() {
  let end = addD(mondayOf(today()), 20);
  const vs = addD(UI.weekStart, 6); if (vs > end) end = vs;
  live('tasks').forEach(t => { if (!t.done && t.due && t.due > end) end = t.due; });
  const cap = addD(today(), 90); if (end > cap) end = cap;
  const key = [REV, today(), Math.floor(nowMin() / 10), end].join('|');
  if (planCache && planCache.key === key) return planCache.val;
  const val = buildPlan(end); planCache = {key, val}; return val;
}

/* Planning : 1) les tâches datées prennent des créneaux avant leur échéance ;
   2) le reste de chaque créneau est de la révision, choisie selon les heures visées,
   les DS et khôlles À VENIR, les chapitres à revoir et les cours du jour. */
function buildPlan(endDate) {
  const t0 = today(), nm = nowMin();
  const slots = [], byDate = {}, warnings = [];
  for (let d = t0; d <= endDate; d = addD(d, 1)) {
    const defs = (S.settings.slots && S.settings.slots[dow(d)]) || [];
    const cl = collesOn(d);
    byDate[d] = [];
    defs.forEach((sl, i) => {
      const a = hm(sl[0]), b = hm(sl[1]);
      const s = {date: d, idx: i, start: sl[0], end: sl[1], a, b, cap: b - a, used: 0, items: [], blocked: null, past: false};
      // Khôlle qui chevauche : on raccourcit le créneau s'il reste 30 min utiles, sinon on le libère
      for (const c of cl) {
        const w = colleSpan(c), ca = w[0] - 10, cb = w[1] + 5;
        if (ca < s.b && cb > s.a) {
          if (ca - s.a >= 30) s.b = ca; else if (s.b - cb >= 30) s.a = cb; else { s.blocked = colleLbl(c.subject); break; }
          s.cap = s.b - s.a;
        }
      }
      if (d === t0) { if (s.b - nm < 25) s.past = true; else if (nm > s.a) s.cap = s.b - nm; }
      slots.push(s); byDate[d].push(s);
    });
  }
  const avail = slots.filter(s => !s.past && !s.blocked && s.cap >= 25);

  // Phase A : tâches du cahier de texte
  const planned = {};
  const tasks = live('tasks').filter(x => !x.done && x.est > 0)
    .sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999') || (b.prio || 2) - (a.prio || 2));
  for (const tk of tasks) {
    let rem = tk.est;
    let allowed = !tk.due || tk.due <= t0 ? avail.slice() : avail.filter(s => s.date <= addD(tk.due, -1));
    if (!allowed.length) allowed = avail.slice();
    const early = !tk.due || (tk.prio || 2) >= 3 || diffDays(t0, tk.due) <= 2;
    if (!early) allowed.reverse();     // échéance lointaine : au plus près de la date, le planning bouge peu
    for (const pass of [1, 2]) {
      if (rem <= 0) break;
      for (const s of allowed) {
        if (rem <= 0) break;
        if (s.items.some(it => it.id === tk.id)) continue;
        const maxUse = pass === 1 ? Math.floor(s.cap * 0.7) : s.cap;   // 1er passage : on garde 30 % pour réviser
        let amt = Math.floor(Math.min(rem, 60, maxUse - s.used) / 5) * 5;
        if (amt < 15 && !(amt > 0 && rem <= amt)) continue;
        s.items.push({kind: 'task', id: tk.id, title: tk.title, subject: tk.subject, min: amt});
        s.used += amt; rem -= amt;
        const wk = mondayOf(s.date); planned[wk] = planned[wk] || {};
        planned[wk][tk.subject] = (planned[wk][tk.subject] || 0) + amt;
      }
    }
    if (rem > 0) warnings.push({task: tk, rem});
  }

  // Chapitres à revoir, rangés par jour (les retards sont ramenés à aujourd'hui)
  const revBy = {};
  live('chapters').forEach(c => { if (!c.next) return; const d = c.next < t0 ? t0 : c.next; revBy[d] = revBy[d] || {}; (revBy[d][c.subject] = revBy[d][c.subject] || []).push(c); });
  const revDone = {};

  // Phase B : révision dans le reste de chaque créneau
  const needs = {}, by = byDay();
  const needFor = wk => {
    if (needs[wk]) return needs[wk];
    const n = {};
    WORK_KEYS.forEach(k => {
      let worked = 0;
      for (let i = 0; i < 7; i++) { const dd = addD(wk, i); if (dd <= t0) worked += ((by[dd] || {})[k] || 0); }
      n[k] = Math.max(0, (S.settings.targets[k] || 0) * 60 - worked - ((planned[wk] || {})[k] || 0));
    });
    return (needs[wk] = n);
  };
  const revCount = {}, prep = {};   // prep : nombre de blocs déjà donnés à la préparation d'une khôlle ou d'un DS
  let prev = null;
  for (const s of avail) {
    const free = Math.floor((s.cap - s.used) / 5) * 5;
    if (free < 20) continue;
    const need = needFor(mondayOf(s.date));
    const cnt = revCount[s.date] = revCount[s.date] || {};
    const sat = addD(mondayOf(s.date), 5);
    const dsItems = sat > s.date ? dsOn(sat) : [];       // un DS n'est préparé qu'AVANT le samedi
    const cl = [];
    for (let i = 0; i <= 2; i++) collesOn(addD(s.date, i)).forEach(c => {   // préparation sur les 2 jours d'avant
      if (c.date > s.date || colleSpan(c)[0] >= s.b) cl.push(c);   // khôlle strictement après la fin du créneau
    });
    const rv = revBy[s.date] || {};
    let best = null;
    for (const k of WORK_KEYS) {
      let sc = need[k] + (S.settings.targets[k] || 0) * 2, why = 'fond', top = 0;
      const bump = (v, w) => { sc += v; if (v > top) { top = v; why = w; } };
      if (dsItems.some(it => dsMatches(it, k))) { const n = prep['ds' + sat + k] || 0; bump(n < 3 ? (dow(s.date) >= 3 ? 300 : 90) : 20, 'ds'); }
      const cc = cl.find(c => c.subject === k);
      if (cc) { const n = prep['c' + cc.date + k] || 0; if (n < 2) bump(n === 0 ? 400 : 110, 'colle:' + cc.date); }
      if (rv[k] && !revDone[s.date + k]) bump(300, 'chap');
      if (!isHoliday(s.date) && S.edt.some(b => !b.del && b.day === dow(s.date) && b.subject === k && hm(b.end) <= s.a)) bump(25, 'cours');
      sc -= ((k === 'maths' || k === 'physique') ? 35 : 70) * (cnt[k] || 0);
      if (prev && prev.date === s.date && prev.k === k) sc -= 30;
      if (!best || sc > best.sc) best = {k, sc, why};
    }
    if (best.why === 'ds') prep['ds' + sat + best.k] = (prep['ds' + sat + best.k] || 0) + 1;
    if (best.why.startsWith('colle:')) { const pk = 'c' + best.why.slice(6) + best.k; prep[pk] = (prep[pk] || 0) + 1; }
    const it = {kind: 'rev', subject: best.k, min: free, why: best.why};
    if (rv[best.k] && !revDone[s.date + best.k]) { it.chaps = rv[best.k]; revDone[s.date + best.k] = true; }
    s.items.push(it);
    s.used += free; need[best.k] = Math.max(0, need[best.k] - free);
    cnt[best.k] = (cnt[best.k] || 0) + 1; prev = {date: s.date, k: best.k};
  }
  return {slots, byDate, warnings};
}
function whyText(it, date) {
  let w;
  if (it.why === 'ds') w = 'Prépa du DS de samedi';
  else if (it.why === 'cours') w = 'Relecture du cours du jour';
  else if (it.why === 'chap') w = 'Révision espacée';
  else if (it.why && it.why.startsWith('colle:')) {
    const cd = it.why.slice(6);
    w = cd === date ? 'Prépa de la khôlle de tout à l\'heure' : cd === addD(date, 1) ? 'Prépa de la khôlle de demain' : 'Prépa de la khôlle de ' + JOURS[dow(cd)];
  } else w = 'Révision de fond';
  if (it.why === 'ds' || (it.why && it.why.startsWith('colle:'))) {
    const n = openErrors(it.subject); if (n) w += `, relis tes ${n} erreur${n > 1 ? 's' : ''} du carnet`;
  }
  return w;
}
const chapLabel = c => `${c.name} (J+${INTERVALS[c.step || 0] || 30})`;

function dayEvents(date) {
  const ev = [], wd = dow(date);
  if (!isHoliday(date)) live('edt').filter(b => b.day === wd).forEach(b => ev.push({t: 'class', a: hm(b.start), b: hm(b.end), subject: b.subject, label: b.label || sname(b.subject)}));
  collesOn(date).forEach(c => { const w = colleSpan(c); ev.push({t: 'colle', a: w[0], b: w[1], c}); });
  const ds = dsOn(date);
  if (ds.length) ev.push({t: 'ds', a: hm('08:00'), b: hm('12:00'), items: ds});
  if (date >= today()) (getPlan().byDate[date] || []).forEach(s => ev.push({t: 'work', a: s.a, b: s.b, slot: s}));
  return ev.sort((x, y) => x.a - y.a || (x.t === 'class' ? -1 : 1));
}

// --- Temps de travail (calculé à partir des sessions) ---
function byDay() {
  if (aggCache && aggCache.rev === REV) return aggCache.v;
  const v = {};
  S.sessions.forEach(r => { if (r.del || !(r.min > 0) || !r.date) return; v[r.date] = v[r.date] || {}; v[r.date][r.subject] = (v[r.date][r.subject] || 0) + r.min; });
  aggCache = {rev: REV, v}; return v;
}
const dayTotal = d => Object.values(byDay()[d] || {}).reduce((a, b) => a + b, 0);
function weekWorked(wk, upTo) {
  const by = {}, all = byDay(); let tot = 0;
  for (let i = 0; i < 7; i++) {
    const d = addD(wk, i); if (upTo && d > upTo) break;
    const o = all[d] || {}; Object.keys(o).forEach(k => { by[k] = (by[k] || 0) + o[k]; tot += o[k]; });
  }
  return {by, tot};
}
const weekGoal = () => WORK_KEYS.reduce((a, k) => a + (S.settings.targets[k] || 0) * 60, 0);
function streak() {
  let n = 0, d = today();
  if (dayTotal(d) < 30) d = addD(d, -1);
  while (dayTotal(d) >= 30 && n < 400) { n++; d = addD(d, -1); }
  return n;
}
const addWork = (date, subject, min) => addRec('sessions', {date, subject, min});

const n20 = g => (g.max > 0 ? g.score / g.max * 20 : null);
function avgOf(list) {
  let s = 0, c = 0;
  list.forEach(g => { const v = n20(g), w = +g.coef > 0 ? +g.coef : 0; if (v != null && w > 0) { s += v * w; c += w; } });
  return c > 0 ? s / c : null;
}
function generalAvg() {
  let s = 0, c = 0; const gr = live('grades');
  Object.keys(SUBJ).forEach(k => {
    const a = avgOf(gr.filter(g => g.subject === k));
    if (a != null) { const w = +S.settings.coefs[k] > 0 ? +S.settings.coefs[k] : 1; s += a * w; c += w; }
  });
  return c > 0 ? s / c : null;
}

function gaugeSvg(worked, goal) {
  const f = goal > 0 ? Math.min(1, worked / goal) : 0, R = 90, cx = 120, cy = 118, L = Math.PI * R;
  let ticks = '';
  for (let i = 0; i <= 10; i++) {
    const a = Math.PI * (1 - i / 10), r1 = R + 9, r2 = R + (i % 5 === 0 ? 20 : 14);
    ticks += `<line x1="${(cx + r1 * Math.cos(a)).toFixed(1)}" y1="${(cy - r1 * Math.sin(a)).toFixed(1)}" x2="${(cx + r2 * Math.cos(a)).toFixed(1)}" y2="${(cy - r2 * Math.sin(a)).toFixed(1)}" stroke="var(--muted)" stroke-width="${i % 5 === 0 ? 2.2 : 1.4}" stroke-linecap="round" opacity=".7"/>`;
  }
  const na = Math.PI * (1 - f), nx = cx + (R - 6) * Math.cos(na), ny = cy - (R - 6) * Math.sin(na);
  return `<svg viewBox="0 0 240 132" role="img" aria-label="Jauge de la semaine">
    <path d="M30 ${cy} A${R} ${R} 0 0 1 210 ${cy}" fill="none" stroke="var(--line)" stroke-width="12" stroke-linecap="round"/>
    <path d="M30 ${cy} A${R} ${R} 0 0 1 210 ${cy}" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(f * L).toFixed(1)} ${L.toFixed(1)}"/>
    ${ticks}<line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="6" fill="var(--ink)"/></svg>`;
}
function reminders() {
  const t0 = today(), nm = nowMin(), out = [];
  live('tasks').filter(t => !t.done && t.due && (diffDays(t0, t.due) <= 3 || (!t.est && diffDays(t0, t.due) <= 7)))
    .forEach(t => out.push({d: t.due, subject: t.subject, title: t.title, sub: t.est ? fmtDur(t.est) : 'Rappel'}));
  for (let i = 0; i <= 2; i++) collesOn(addD(t0, i)).forEach(c => {
    if (c.date === t0 && colleSpan(c)[1] <= nm) return;           // khôlle déjà passée : plus de rappel
    out.push({d: c.date, subject: c.subject, title: colleLbl(c.subject), sub: `${c.who}, passage à ${fmtT(colleStart(c))}`});
  });
  for (let i = 0; i <= 6; i++) {
    const d = addD(t0, i), ds = dsOn(d);
    if (!ds.length || ds[0].s === 'cb' || (d === t0 && nm >= hm('12:00'))) continue;
    out.push({d, subject: ds[0].s, title: 'DS : ' + ds.map(x => sname(x.s)).join(' + '), sub: 'Samedi matin'});
  }
  return out.sort((a, b) => a.d.localeCompare(b.d));
}

    if (e) return {d, e, delta: i === 0 ? e.a - nm : null};
  }

}

/* ---------- Chrono ---------- */
const tmElapsed = (t, now) => t.phaseAcc + (t.running ? now - t.phaseStart : 0);
const tmWork = (t, now) => t.workTotal + (t.phase === 'work' ? tmElapsed(t, now) : 0);

  let ms;

}

  return mode === 'free' ? grp(str.slice(0, 2)) + '<span class="colon">:</span>' + grp(str.slice(2, 4)) + '<span class="colon">:</span>' + grp(str.slice(4, 6))

function VIEWS_timer() {

function startTimer() {

function chartSvg(list) {
  const W = 340, H = 170, L = 26, R = 10, Tp = 10, B = 22;
  if (!list.length) return '';
  const ds = list.map(g => pd(g.date).getTime()), mn = Math.min(...ds), mx = Math.max(...ds);
  const X = t => L + (mx === mn ? (W - L - R) / 2 : (t - mn) / (mx - mn) * (W - L - R)), Y = v => Tp + (1 - Math.min(20, v) / 20) * (H - Tp - B);
  let grid = ''; [0, 5, 10, 15, 20].forEach(v => { grid += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`; });
  const run = []; let s = 0, c = 0;
  list.forEach(g => { const v = n20(g), w = +g.coef > 0 ? +g.coef : 0; if (v != null && w > 0) { s += v * w; c += w; } run.push(c ? s / c : null); });
  const pts = list.map((g, i) => run[i] == null ? null : `${X(pd(g.date).getTime()).toFixed(1)},${Y(run[i]).toFixed(1)}`).filter(Boolean);
  const dots = list.map(g => { const v = n20(g); return v == null ? '' : `<circle cx="${X(pd(g.date).getTime()).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="5" fill="${col(g.subject)}" stroke="var(--surface)" stroke-width="2"/>`; }).join('');
  const lab = `<text x="${L}" y="${H - 4}">${esc(fmtShort(list[0].date))}</text><text x="${W - R}" y="${H - 4}" text-anchor="end">${esc(fmtShort(list[list.length - 1].date))}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe des notes">${grid}${pts.length > 1 ? `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : ''}${dots}${lab}</svg><div class="sub">Points : chaque note. Trait : moyenne pondérée cumulée.</div>`;
}

function saveSyncCfg() {
  const u = $('[name=surl]'), k = $('[name=skey]');
  let url = (u.value || '').trim(), key = (k.value || '').trim();
  const hash = url.indexOf('#'); if (hash > 0) { key = url.slice(hash + 1).trim(); url = url.slice(0, hash).trim(); }
  if (!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(url)) { toast('Adresse invalide : elle doit finir par /exec'); return; }
  if (key.length < 16) { toast('Clé trop courte : copie celle affichée par setup()'); return; }

  closeSheet(); toast('Synchronisation en cours…'); syncNow();
}

const exportJSON = () => JSON.stringify({app: 'cahier-de-bord', schema: SCHEMA, exportedAt: new Date().toISOString(), core: S}, null, 1);
async function doExport() {
  const data = exportJSON(), name = `cahier-de-bord-${today()}.json`;
  try {
    const file = new File([data], name, {type: 'application/json'});
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: name}); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type: 'application/json'})); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast('Sauvegarde téléchargée'); return;
  } catch (e) { /* repli ci-dessous */ }
  openSheet(`<h2>Sauvegarde</h2><label class="fld"><textarea id="exp" readonly style="min-height:180px;font-size:13px">${esc(data)}</textarea></label><div class="sheet-actions"><button class="btn primary" data-act="copy-exp">Copier</button></div>`);
}

    <label class="fld"><span>Fichier .json</span><input type="file" id="impfile" accept=".json,application/json,text/plain"></label>
    <label class="fld"><span>Ou colle le contenu ici</span><textarea name="json" style="min-height:120px;font-size:13px"></textarea></label>
    <div class="sheet-actions"><button class="btn primary" type="submit">Importer</button></div></form>`;

function doImport(text) {
  let o; try { o = JSON.parse(text); } catch (e) { toast('Fichier illisible : ce n\'est pas du JSON valide'); return; }
  const core = o && o.core ? o.core : (o && (o.tasks || o.edt) ? o : null);
  if (!core) { toast('Fichier non reconnu'); return; }
  const imp = migrate(core, o.time), now = Date.now();
  imp.settings.u = now;
  COLS.forEach(k => imp[k].forEach(r => { r.u = now; delete r.su; }));   // l'import passe devant les anciennes versions
  Object.keys(imp.slotDone).forEach(k => { imp.slotDone[k].u = now; });
  closeSheet(); replaceState(merge(S, imp)); scheduleSync(300); toast('Données importées');
}

/* ---------- Événements ---------- */
const VIEWS = {home: VIEWS_home, week: VIEWS_week, tasks: VIEWS_tasks, timer: VIEWS_timer, suivi: VIEWS_suivi};
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isNaN(n) ? NaN : n; };
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'tab': UI.tab = el.dataset.tab; UI.fs = 'all'; closeSheet(); render(); window.scrollTo(0, 0); break;
    case 'goday': UI.tab = 'week'; UI.weekStart = mondayOf(el.dataset.d); UI.day = el.dataset.d; render(); window.scrollTo(0, 0); break;
    case 'wk-prev': UI.weekStart = addD(UI.weekStart, -7); render(); break;
    case 'wk-next': UI.weekStart = addD(UI.weekStart, 7); render(); break;
    case 'wk-today': UI.weekStart = mondayOf(today()); UI.day = today(); render(); break;
    case 'pick-day': UI.day = el.dataset.d; render(); break;
    case 'toggle-slot': commit(s => { const k = el.dataset.key, cur = s.slotDone[k]; s.slotDone[k] = {v: !(cur && cur.v), u: Date.now()}; }); break;
    case 'fab': openSheet(UI.tab === 'tasks' ? taskForm() : UI.suivi === 'chap' ? chapForm() : UI.suivi === 'err' ? errForm() : gradeForm()); break;
    case 'settings': openSheet(settingsForm()); break;
    case 'sheet-close': closeSheet(); break;
    case 'task-filter': UI.taskFilter = el.dataset.f; render(); break;
    case 'task-edit': { const t = findRec('tasks', id); if (t) openSheet(taskForm(t)); break; }
    case 'task-toggle': { ev.stopPropagation(); const t = findRec('tasks', id); if (t) updRec('tasks', id, {done: !t.done, doneAt: t.done ? null : Date.now()}); break; }
    case 'task-del': closeSheet(); delRec('tasks', id); break;
    case 'due-quick': { const i = $('[name=due]'); if (i) i.value = el.dataset.d; break; }
    case 'suivi': UI.suivi = el.dataset.v; UI.fs = 'all'; render(); break;
    case 'fsubj': UI.fs = el.dataset.k; render(); break;
    case 'chap-edit': { const c = findRec('chapters', id); if (c) openSheet(chapForm(c)); break; }
    case 'chap-del': closeSheet(); commit(s => {
      const i = s.chapters.findIndex(x => x.id === id); if (i >= 0) s.chapters[i] = tomb(s.chapters[i], Date.now());
      s.errors.forEach(e => { if (!e.del && e.chapter === id) { e.chapter = ''; e.u = Date.now(); } });
    }); break;
    case 'chap-ok': { const c = findRec('chapters', id); if (c) { updRec('chapters', id, chapDone(c)); toast(c.step + 1 >= INTERVALS.length ? 'Cycle de révisions terminé' : 'Prochaine révision programmée'); } break; }
    case 'chap-again': { const c = findRec('chapters', id); if (c) { updRec('chapters', id, {next: addD(today(), 1)}); toast('À revoir demain'); } break; }
    case 'chap-restart': { const t0 = today(); closeSheet(); updRec('chapters', id, Object.assign({seen: t0}, schedFrom(t0))); toast('Révisions relancées'); break; }
    case 'err-filter': UI.ef = el.dataset.f; render(); break;
    case 'err-edit': { const e = findRec('errors', id); if (e) openSheet(errForm(e)); break; }
    case 'err-toggle': { ev.stopPropagation(); const e = findRec('errors', id); if (e) updRec('errors', id, {status: e.status === 'fixed' ? 'open' : 'fixed'}); break; }
    case 'err-del': closeSheet(); delRec('errors', id); break;
    case 'grade-filter': UI.gradeFilter = el.dataset.k; render(); break;
    case 'grade-edit': { const g = findRec('grades', id); if (g) openSheet(gradeForm(g)); break; }
    case 'grade-del': closeSheet(); delRec('grades', id); break;
    case 'timer-pick': UI.timerSubject = el.dataset.k; saveUI(); render(); break;
    case 'timer-mode': UI.timerMode = el.dataset.m; saveUI(); render(); break;
    case 'timer-start': startTimer(); break;
    case 'timer-toggle': toggleTimer(); break;
    case 'timer-stop': stopTimer(); break;
    case 'session-new': openSheet(sessionForm()); break;
    case 'sess-del': delRec('sessions', id); toast('Session supprimée'); break;
    case 'edt-list': openSheet(edtList()); break;
    case 'edt-new': openSheet(edtForm()); break;
    case 'edt-edit': { const b = findRec('edt', id); if (b) openSheet(edtForm(b)); break; }
    case 'edt-del': delRec('edt', id); openSheet(edtList()); break;
    case 'sync-save': saveSyncCfg(); break;
    case 'sync-copy': { const code = CFG.url + '#' + CFG.key; try { navigator.clipboard.writeText(code).then(() => toast('Code copié'), () => toast(code)); } catch (e) { toast(code); } break; }
    case 'sync-off': CFG = null; lsDel(LS_CFG); setSync('local'); closeSheet(); toast('Cet appareil n\'est plus synchronisé'); render(); break;
    case 'export': doExport(); break;
    case 'import': openSheet(importForm()); break;
    case 'copy-exp': { const t = $('#exp'); if (t) { t.select(); try { navigator.clipboard.writeText(t.value).then(() => toast('Copié')); } catch (e) { document.execCommand('copy'); toast('Copié'); } } break; }
  }
});
document.addEventListener('keydown', ev => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('[role=button][data-act]')) { ev.preventDefault(); ev.target.click(); } });
document.addEventListener('change', ev => {   // formulaire d'erreur : la liste des chapitres suit la matière choisie
  const f = ev.target.closest('form[data-form="err"]');
  if (f && ev.target.name === 'subject') f.elements.chapter.innerHTML = chapOptions(ev.target.value, '');
});
document.addEventListener('submit', ev => {
  const f = ev.target.closest('form[data-form]'); if (!f) return;
  ev.preventDefault();
  const fd = Object.fromEntries(new FormData(f).entries()), id = f.dataset.id, kind = f.dataset.form;
  if (kind === 'task') {
    const rec = {title: String(fd.title).trim(), subject: fd.subject, due: fd.due || null, est: +fd.est || 0, prio: +fd.prio || 2, notes: fd.notes || ''};
    if (!rec.title) return;
    closeSheet();
    if (id) updRec('tasks', id, rec); else { addRec('tasks', Object.assign({done: false, created: Date.now()}, rec)); toast('Tâche ajoutée, planning ajusté'); }
  } else if (kind === 'chap') {
    const rec = {name: String(fd.name).trim(), subject: fd.subject, seen: fd.seen || today(), status: +fd.status || 0, conf: +fd.conf || 3, notes: fd.notes || ''};
    if (!rec.name) return;
    const old = id && findRec('chapters', id);
    if (!old || old.seen !== rec.seen) Object.assign(rec, schedFrom(rec.seen));
    closeSheet();
    if (old) updRec('chapters', id, rec); else { addRec('chapters', rec); toast(rec.next ? `Première révision : ${relDay(rec.next).toLowerCase()}` : 'Chapitre ajouté'); }
  } else if (kind === 'err') {
    const rec = {subject: fd.subject, chapter: fd.chapter || '', notion: String(fd.notion).trim(), wrong: fd.wrong || '', fix: fd.fix || '', date: fd.date || today(), status: fd.status === 'fixed' ? 'fixed' : 'open'};
    if (!rec.notion) return;
    closeSheet();
    if (id) updRec('errors', id, rec); else addRec('errors', rec);
  } else if (kind === 'grade') {
    const rec = {subject: fd.subject, kind: fd.kind, date: fd.date, score: num(fd.score), max: num(fd.max) || 20, coef: num(fd.coef) || 1, comment: fd.comment || ''};
    if (isNaN(rec.score) || rec.score < 0) { toast('Note invalide'); return; }
    closeSheet();
    if (id) updRec('grades', id, rec); else addRec('grades', rec);
  } else if (kind === 'session') {
    const m = Math.round(num(fd.min)); if (!(m > 0)) return;
    closeSheet(); addWork(fd.date || today(), fd.subject, m); toast(`Session ajoutée : ${fmtDur(m)}`);
  } else if (kind === 'edt') {
    if (hm(fd.end) <= hm(fd.start)) { toast('L\'heure de fin doit suivre celle du début'); return; }
    const rec = {label: String(fd.label).trim(), day: +fd.day, subject: fd.subject, start: fd.start, end: fd.end};
    if (id) updRec('edt', id, rec); else addRec('edt', rec);
    openSheet(edtList());
  } else if (kind === 'settings') {
    const targets = {}, coefs = {};
    WORK_KEYS.forEach(k => { const t = num(fd['t_' + k]), c = num(fd['c_' + k]); targets[k] = t >= 0 ? t : 0; coefs[k] = c > 0 ? c : 1; });
    closeSheet();
    setSettings({name: String(fd.name).trim() || 'Antoine', option: fd.option, colleSlot: +fd.colleSlot || 3, targets: Object.assign({}, S.settings.targets, targets), coefs: Object.assign({}, S.settings.coefs, coefs)});
    toast('Réglages enregistrés');
  } else if (kind === 'import') {
    const file = $('#impfile') && $('#impfile').files[0];
    if (file) { const r = new FileReader(); r.onload = () => doImport(String(r.result)); r.readAsText(file); }
    else if (fd.json && String(fd.json).trim()) doImport(fd.json);
    else toast('Choisis un fichier ou colle le contenu');
  }
});

/* ==========================================================================
   SECTION 7 : DÉMARRAGE
   ========================================================================== */
render();
if (CFG) scheduleSync(400); else setSync('local');
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
